apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: production
  labels:
    app: ledger-api
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
    spec:
      containers:
        - name: ledger-api
          image: ghcr.io/aice/ledger-api:1.4.0
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: info
            - name: MAX_CONNS
              value: "64"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-worker
  namespace: production
  labels:
    app: webhook-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-worker
  template:
    metadata:
      labels:
        app: webhook-worker
    spec:
      containers:
        - name: webhook-worker
          image: ghcr.io/aice/webhook-worker:1.4.0
          env:
            - name: RUST_LOG
              value: info
            - name: WORKER_CONCURRENCY
              value: "16"
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
