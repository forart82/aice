<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151D33"/>
      <stop offset="40%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7B2CBF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Cyan Beam Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>

    <!-- Magenta Beam Gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7B2CBF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060910" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Obsidian Badge Background -->
  <rect x="12" y="12" width="232" height="232" rx="52" ry="52" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3" filter="url(#shadowFilter)"/>

  <!-- Core Ambient Glow -->
  <circle cx="128" cy="105" r="85" fill="url(#coreGlow)"/>

  <!-- Subtle Circuit / AST Network Lines -->
  <g stroke="#233554" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6">
    <line x1="45" y1="105" x2="85" y2="105"/>
    <line x1="171" y1="105" x2="211" y2="105"/>
    <line x1="128" y1="45" x2="128" y2="70"/>
  </g>

  <!-- Bidirectional Lens & AST Chevron Glyphs -->
  <g id="glyphs">
    <!-- Left Ingestion Chevron < -->
    <path d="M 96 68 L 62 105 L 96 142" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowCyan)"/>

    <!-- Right Emission Chevron > -->
    <path d="M 160 68 L 194 105 L 160 142" fill="none" stroke="url(#magentaGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowMagenta)"/>

    <!-- Central Lens & AST Homoiconic Core (Diamond Loop) -->
    <polygon points="128,82 145,105 128,128 111,105" fill="#131B2E" stroke="#00F5FF" stroke-width="3.5" filter="url(#neonGlowCyan)"/>
    <polygon points="128,91 138,105 128,119 118,105" fill="#FF007F" opacity="0.9"/>
    <circle cx="128" cy="105" r="3" fill="#FFFFFF"/>

    <!-- Bidirectional Energy Bridge -->
    <line x1="88" y1="105" x2="111" y2="105" stroke="#00F5FF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="145" y1="105" x2="168" y2="105" stroke="#FF007F" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: AICE 2.0 Token Engine -->
  <text x="128" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">AICE</text>

  <!-- Subtitle Tag: TOKENOMICS -->
  <text x="128" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="10" fill="#00F5FF" text-anchor="middle" letter-spacing="5" opacity="0.85">HOMOICONIC</text>
</svg>
