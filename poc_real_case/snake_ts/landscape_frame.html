<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
    }
    .phone-container {
      width: 844px;
      height: 390px;
      position: relative;
      background: #05080f;
      border-radius: 46px;
      box-shadow: 0 0 0 10px #1e293b, 0 0 0 13px #334155, 0 25px 70px rgba(0,0,0,0.85), 0 0 50px rgba(0, 240, 181, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: row;
    }
    .dynamic-island {
      width: 28px;
      height: 90px;
      background: #000;
      border-radius: 14px;
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 101;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .camera-lens {
      width: 11px;
      height: 11px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 50%;
    }
    .sensor-indicator {
      width: 8px;
      height: 8px;
      background: #00f0b5;
      border-radius: 50%;
      box-shadow: 0 0 6px #00f0b5;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #05080f;
    }
    .home-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 4px;
      background: #ffffff;
      opacity: 0.65;
      border-radius: 2px;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="dynamic-island">
      <div class="camera-lens"></div>
      <div class="sensor-indicator"></div>
    </div>
    <iframe id="game-frame" src="/"></iframe>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
