<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouroboros Galaxy — Smartphone Emulated Environment</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch', 'Orbitron', 'Rajdhani', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      padding: 16px;
    }
    
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 240, 181, 0.35);
      padding: 8px 16px;
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 25px rgba(0,0,0,0.6), 0 0 20px rgba(0, 240, 181, 0.15);
      z-index: 1000;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tool-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #94a3b8;
      padding: 7px 16px;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tool-btn:hover {
      color: #00f0b5;
      border-color: #00f0b5;
      box-shadow: 0 0 10px rgba(0, 240, 181, 0.3);
    }
    .tool-btn.active {
      background: linear-gradient(135deg, #00f0b5, #10b981);
      color: #05080f;
      border-color: transparent;
      box-shadow: 0 0 16px rgba(0, 240, 181, 0.5);
    }

    /* Smartphone Chassis Frame */
    .device-wrapper {
      position: relative;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Portrait Preset: 393 x 852 (iPhone 15 Pro standard) */
    .device-wrapper.portrait {
      width: 393px;
      height: 852px;
    }

    /* Landscape Preset: 852 x 393 */
    .device-wrapper.landscape {
      width: 852px;
      height: 393px;
    }

    .phone-chassis {
      width: 100%;
      height: 100%;
      position: relative;
      background: #05080f;
      border-radius: 52px;
      box-shadow: 
        0 0 0 10px #1e293b,
        0 0 0 13px #334155,
        0 0 0 15px #0b1329,
        0 30px 90px rgba(0,0,0,0.9),
        0 0 60px rgba(0, 240, 181, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .device-wrapper.landscape .phone-chassis {
      border-radius: 46px;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      background: rgba(5, 8, 15, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      z-index: 100;
      user-select: none;
      flex-shrink: 0;
    }
    .device-wrapper.landscape .status-bar {
      height: 32px;
      padding: 0 36px;
      font-size: 11px;
    }

    .dynamic-island {
      width: 120px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .device-wrapper.landscape .dynamic-island {
      top: 4px;
      width: 90px;
      height: 22px;
    }

    .camera-lens {
      width: 11px;
      height: 11px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 50%;
    }
    .sensor-indicator {
      width: 7px;
      height: 7px;
      background: #00f0b5;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f0b5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #05080f;
      flex: 1;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 136px;
      height: 5px;
      background: #ffffff;
      opacity: 0.65;
      border-radius: 3px;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="btn-menu" class="tool-btn active" onclick="setScreen('menu', this)">📱 Menu</button>
    <button id="btn-zen" class="tool-btn" onclick="setScreen('zen', this)">👁️ Pure View</button>
    <button id="btn-class" class="tool-btn" onclick="setScreen('class', this)">🐍 Class Select</button>
    <button id="btn-combat" class="tool-btn" onclick="setScreen('combat', this)">⚔️ Combat</button>
    <button id="btn-pause" class="tool-btn" onclick="setScreen('pause', this)">⏸️ Pause</button>
    <button id="btn-draft" class="tool-btn" onclick="setScreen('draft', this)">🧬 Draft</button>
    <button id="btn-sanctuary" class="tool-btn" onclick="setScreen('sanctuary', this)">🏛️ Sanctuary</button>
    <button id="btn-lab" class="tool-btn" onclick="setScreen('lab', this)">🧬 Bio-Lab</button>
    <button id="btn-settings" class="tool-btn" onclick="setScreen('settings', this)">⚙️ Settings</button>
    <button id="btn-multiscreen" class="tool-btn" onclick="setScreen('multiscreen', this)">📱 Dual-Screen</button>
    <button id="btn-codex" class="tool-btn" onclick="setScreen('codex', this)">📖 Codex</button>
    <button id="btn-checklist" class="tool-btn" onclick="setScreen('checklist', this)">📋 Dev Checklist</button>
    <button id="btn-rotate" class="tool-btn" onclick="toggleOrientation(this)">🔄 Rotate 90°</button>
  </div>

  <div id="device" class="device-wrapper portrait">
    <div class="phone-chassis">
      <div class="status-bar">
        <span>09:41</span>
        <div class="dynamic-island">
          <div class="camera-lens"></div>
          <div class="sensor-indicator"></div>
        </div>
        <span>5G &bull; 100%</span>
      </div>
      <iframe id="game-frame" src="/"></iframe>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    const device = document.getElementById('device');
    const iframe = document.getElementById('game-frame');
    const initParams = new URLSearchParams(window.location.search);
    const initScreen = initParams.get('screen') || 'menu';
    iframe.src = '/?screen=' + encodeURIComponent(initScreen);

    function waitForApp(callback, maxAttempts = 60) {
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        try {
          const app = iframe.contentWindow && iframe.contentWindow.ouroborosApp;
          if (app && app.uiRoot && app.engine) {
            clearInterval(interval);
            callback(app);
            return;
          }
        } catch(e) {}
        if (attempts >= maxAttempts) {
          clearInterval(interval);
        }
      }, 80);
    }

    function applyScreenState(scr) {
      waitForApp((app) => {
        if (scr === 'menu') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.engine.showMenu();
        } else if (scr === 'zen' || scr === 'pure') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.engine.showMenu();
          app.uiRoot.hideAllScreens();
        } else if (scr === 'class') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.engine.chooseMode('rogue');
        } else if (scr === 'sanctuary') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.engine.showSanctuary();
        } else if (scr === 'lab') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.uiRoot.showScreen('modal-snake-lab');
        } else if (scr === 'settings') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.uiRoot.showScreen('modal-settings');
        } else if (scr === 'multiscreen') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.uiRoot.showScreen('modal-multiscreen');
        } else if (scr === 'pause') {
          if (!app.engine.runInProgress) {
            app.engine.chooseMode('rogue');
            app.engine.selectedClass = 'emerald';
            app.engine.startRun();
          }
          app.engine.pause();
          app.uiRoot.showScreen('modal-pause');
        } else if (scr === 'draft') {
          if (!app.engine.runInProgress) {
            app.engine.chooseMode('rogue');
            app.engine.selectedClass = 'emerald';
            app.engine.startRun();
          }
          app.engine.triggerLevelUp();
        } else if (scr === 'codex') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.uiRoot.showScreen('modal-help');
        } else if (scr === 'checklist' || scr === 'dev-checklist') {
          if (app.engine.runInProgress) app.engine.abandonRun();
          app.uiRoot.showScreen('modal-dev-checklist');
        } else if (scr === 'combat') {
          app.engine.chooseMode('rogue');
          app.engine.selectedClass = 'emerald';
          app.engine.startRun();
          app.engine.Combat.AddScore(5420);
          app.engine.Combat.RegisterComboHit(7);
          for (let i = 0; i < 40; i++) {
            app.engine.tick(0.04);
          }
        }
      });
    }

    function setScreen(scr, btn) {
      document.querySelectorAll('.toolbar .tool-btn').forEach(b => {
        if (!b.innerText.includes('Rotate')) b.classList.remove('active');
      });
      if (btn) btn.classList.add('active');
      applyScreenState(scr);
    }

    function toggleOrientation(btn) {
      if (device.classList.contains('portrait')) {
        device.classList.remove('portrait');
        device.classList.add('landscape');
      } else {
        device.classList.remove('landscape');
        device.classList.add('portrait');
      }
      setTimeout(() => {
        const win = iframe.contentWindow;
        if (win) {
          win.dispatchEvent(new Event('resize'));
        }
      }, 150);
    }

    iframe.onload = () => {
      setTimeout(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const scr = urlParams.get('screen') || 'menu';
        const orient = urlParams.get('orientation');
        if (orient === 'landscape') {
          device.classList.remove('portrait');
          device.classList.add('landscape');
        }
        const activeBtn = document.getElementById('btn-' + scr);
        if (activeBtn) {
          document.querySelectorAll('.toolbar .tool-btn').forEach(b => {
            if (!b.innerText.includes('Rotate')) b.classList.remove('active');
          });
          activeBtn.classList.add('active');
        }
        applyScreenState(scr);
      }, 350);
    };
  </script>
</body>
</html>
