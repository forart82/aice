<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05080f" />
  <title>Ouroboros Galaxy — Cosmic Roguelike RPG Combo Snake</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">


  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);

      --ui-scale: 1;
      --hud-font: 12px;
      --hud-pad: 16px;
      --modal-pad: 24px;
      --safe-left: 0px;
      --safe-top: 0px;
      --safe-right: 0px;
      --safe-bottom: 0px;

      --cyan: #00f0b5;
      --cyan-dim: #00a880;
      --cyan-glow: rgba(0, 240, 181, 0.42);
      --gold: #ffb703;
      --gold-soft: #ffd166;
      --crimson: #ff3366;
      --magenta: #f72585;
      --violet: #9d4edd;
      --blue: #3a86ff;
      --bg-dark: #05080f;
      --bg-glass: rgba(4, 9, 18, 0.72);
      --bg-glass-card: rgba(10, 20, 36, 0.9);
      --line: rgba(148, 163, 184, 0.18);
      --line-neon: rgba(0, 240, 181, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Chakra Petch', 'Orbitron', 'Rajdhani', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    #ui-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* ---------------------------------------------------- Modal Overlays */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 6, 12, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, calc(var(--sat) + 12px)) max(16px, calc(var(--sar) + 12px)) max(14px, calc(var(--sab) + 10px)) max(16px, calc(var(--sal) + 12px));
      pointer-events: auto;
      z-index: 50;
      animation: fadeIn 0.2s ease-out;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-panel {
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--line-neon);
      box-shadow: 0 0 35px rgba(0, 240, 181, 0.15), inset 0 0 20px rgba(0, 240, 181, 0.05);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-height: calc(100vh - 2 * max(14px, var(--modal-pad)));
      max-height: calc(100dvh - 2 * max(14px, var(--modal-pad)));
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .cyber-modal-title {
      font-size: clamp(18px, 2.5vw, 24px);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan-glow);
      flex-shrink: 0;
    }

    .cyber-modal-subtitle {
      font-size: clamp(11px, 1.4vw, 13px);
      color: #94a3b8;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    /* Scroll containers inside modals */
    .modal-content-area,
    .class-cards-scroll-container,
    .sanctuary-grid-scroll-container,
    .settings-form-scroll-container,
    .lab-scroll-container,
    .multiscreen-options-grid,
    .pause-controls-body,
    .stats-wrapper,
    .cards-deck-grid,
    .dev-scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
      min-height: 0;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--line-neon) transparent;
    }

    .modal-content-area::-webkit-scrollbar,
    .class-cards-scroll-container::-webkit-scrollbar,
    .sanctuary-grid-scroll-container::-webkit-scrollbar,
    .settings-form-scroll-container::-webkit-scrollbar,
    .lab-scroll-container::-webkit-scrollbar,
    .multiscreen-options-grid::-webkit-scrollbar,
    .pause-controls-body::-webkit-scrollbar,
    .stats-wrapper::-webkit-scrollbar,
    .cards-deck-grid::-webkit-scrollbar,
    .dev-scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .modal-content-area::-webkit-scrollbar-thumb,
    .class-cards-scroll-container::-webkit-scrollbar-thumb,
    .sanctuary-grid-scroll-container::-webkit-scrollbar-thumb,
    .settings-form-scroll-container::-webkit-scrollbar-thumb,
    .lab-scroll-container::-webkit-scrollbar-thumb,
    .multiscreen-options-grid::-webkit-scrollbar-thumb,
    .pause-controls-body::-webkit-scrollbar-thumb,
    .stats-wrapper::-webkit-scrollbar-thumb,
    .cards-deck-grid::-webkit-scrollbar-thumb,
    .dev-scroll-container::-webkit-scrollbar-thumb {
      background: var(--line-neon);
      border-radius: 4px;
    }

    /* Status badges and meter widgets */
    .cyber-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      border: 1px solid var(--cyan);
      border-radius: 4px;
      background: rgba(0, 240, 181, 0.08);
      white-space: nowrap;
    }

    .meter-container {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
    }

    .meter-fill {
      height: 100%;
      border-radius: inherit;
      transition: width 0.2s ease-out;
    }

    /* ---------------------------------------------------- Buttons */
    .cyber-btn {
      font-family: inherit;
      font-size: clamp(11px, 1.3vw, 14px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease-out;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .cyber-btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f0b5, #10b981);
      color: #05080f;
      box-shadow: 0 0 16px rgba(0, 240, 181, 0.4);
    }
    .btn-primary:hover {
      box-shadow: 0 0 24px rgba(0, 240, 181, 0.6);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.8);
      color: #f8fafc;
      border-color: var(--line-neon);
    }
    .btn-secondary:hover {
      background: rgba(0, 240, 181, 0.12);
      border-color: var(--cyan);
    }

    .btn-ghost {
      background: transparent;
      color: #cbd5e1;
      border-color: var(--line);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: #f8fafc;
    }

    .btn-danger {
      background: rgba(255, 51, 102, 0.15);
      color: #ff3366;
      border-color: rgba(255, 51, 102, 0.5);
    }
    .btn-danger:hover {
      background: rgba(255, 51, 102, 0.3);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 11px;
    }

    .modal-actions-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    /* ---------------------------------------------------- Main Menu */
    .title-panel {
      max-width: 540px;
    }

    .game-title-wrap {
      margin-bottom: 6px;
    }

    .game-title {
      font-family: 'Audiowide', 'Orbitron', 'Chakra Petch', 'Rajdhani', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: clamp(26px, 5.5vw, 42px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .top-title {
      background: linear-gradient(180deg, #ffffff 0%, #00f0b5 60%, #00a880 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(0, 240, 181, 0.55));
    }
    .bottom-title {
      background: linear-gradient(180deg, #fff3b0 0%, #ffb703 60%, #fb8500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(255, 183, 3, 0.55));
    }

    .game-tagline {
      font-family: 'Oxanium', 'Chakra Petch', 'Orbitron', 'Rajdhani', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: clamp(9.5px, 1.6vw, 11.5px);
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.22em;
      margin-top: 6px;
    }

    .menu-best-row {
      display: flex !important;
      flex-direction: row !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 8px !important;
      flex-wrap: wrap !important;
      margin: 8px 0 !important;
    }

    .best-pill {
      background: rgba(4, 9, 18, 0.75);
      border: 1px solid var(--line);
      border-radius: 9999px;
      padding: 4px 12px;
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      width: auto !important;
      gap: 6px;
      font-size: 11.5px;
    }
    .pill-label { color: #94a3b8; font-size: 10px; }
    .pill-val { color: var(--cyan); font-weight: 700; }
    .shard-pill .pill-val { color: var(--gold-soft); }

    .menu-buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    .mode-buttons-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-sub-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .menu-footer {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
    }

    /* ---------------------------------------------------- Class Select */
    .class-panel {
      max-width: 960px;
    }

    .class-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
    }

    .class-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-sizing: border-box;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .class-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 240, 181, 0.2);
    }

    .class-card.selected {
      border-width: 1.5px;
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    .class-card.locked {
      opacity: 0.65;
      filter: grayscale(0.5);
    }

    .class-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
      flex-wrap: wrap;
    }

    .class-icon { font-size: 24px; }
    .class-name { font-size: 14.5px; font-weight: 700; color: #f8fafc; }
    .class-passive { font-size: 11.5px; color: var(--gold-soft); line-height: 1.35; }
    .class-skill { font-size: 11.5px; color: #cbd5e1; line-height: 1.35; }
    .class-stats-preview { font-size: 11px; color: var(--cyan); font-weight: 600; margin-top: auto; padding-top: 6px; border-top: 1px solid rgba(148, 163, 184, 0.15); }
    .class-lock-badge {
      background: rgba(157, 78, 221, 0.25);
      border: 1px solid var(--violet);
      color: var(--gold-soft);
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ---------------------------------------------------- Draft Modal */
    .draft-panel {
      max-width: 900px;
    }

    .draft-title {
      font-size: clamp(18px, 2.8vw, 24px);
      color: var(--cyan);
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .draft-subtitle {
      font-size: clamp(11px, 1.4vw, 13px);
      color: #94a3b8;
    }

    .cards-deck-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
    }

    .upgrade-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-sizing: border-box;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .upgrade-card:hover {
      transform: translateY(-3px);
    }

    .upgrade-card.rarity-common { border-color: rgba(0, 240, 181, 0.45); box-shadow: 0 0 16px rgba(0, 240, 181, 0.2); }
    .upgrade-card.rarity-rare { border-color: rgba(58, 134, 255, 0.55); box-shadow: 0 0 18px rgba(58, 134, 255, 0.25); }
    .upgrade-card.rarity-epic { border-color: rgba(157, 78, 221, 0.55); box-shadow: 0 0 20px rgba(157, 78, 221, 0.3); }
    .upgrade-card.rarity-legendary { border-color: rgba(255, 183, 3, 0.6); box-shadow: 0 0 24px rgba(255, 183, 3, 0.35); }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-rarity-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
    .card-icon { font-size: 28px; }
    .card-title { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .card-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; }
    .card-stats { font-size: 12px; color: var(--cyan); font-weight: 600; }
    .card-stack-tag { font-size: 10.5px; color: #94a3b8; margin-top: auto; padding-top: 6px; border-top: 1px solid rgba(148, 163, 184, 0.12); }

    /* Vertical stack for narrow/portrait mode */
    @media (max-width: 768px), (orientation: portrait) {
      .cards-deck-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .upgrade-card {
        padding: 10px 14px;
        gap: 5px;
      }
      .card-icon { font-size: 22px; }
      .card-title { font-size: 14px; }
      .card-desc { font-size: 11.5px; }
    }

    /* ---------------------------------------------------- In-Game HUD */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: max(var(--hud-pad), calc(var(--sat) + 8px)) max(var(--hud-pad), var(--sar)) max(var(--hud-pad), var(--sab)) max(var(--hud-pad), var(--sal));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .hud-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 2200px;
      margin: 0 auto;
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
    }

    .hud-panel {
      background: var(--bg-glass);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: auto;
    }

    .hud-vitals {
      min-width: 190px;
      max-width: 300px;
      flex: 0 1 auto;
    }

    .hud-vitals-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: var(--hud-font);
    }

    .hud-lvl-badge {
      background: rgba(0, 240, 181, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 1px 5px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 10px;
    }

    .hud-class-tag {
      font-weight: 600;
      color: #f8fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hud-hp-val {
      font-size: 10.5px;
      color: var(--gold-soft);
      font-weight: 600;
    }

    .hud-bar-wrap {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 4px;
      overflow: hidden;
    }

    .hp-bar-wrap { height: 9px; }
    .shield-bar-wrap { height: 6px; }
    .xp-bar-wrap { height: 4px; }
    .floor-bar-wrap { height: 6px; width: 160px; max-width: 100%; }

    .hud-bar-fill {
      height: 100%;
      transition: width 0.12s ease-out;
    }

    .hp-bar-fill { background: linear-gradient(90deg, #ef4444, #f72585); }
    .hp-bar-fill.hp-critical { animation: criticalPulse 0.78s infinite alternate; }
    @keyframes criticalPulse {
      from { opacity: 1; filter: brightness(1.5); }
      to { opacity: 0.4; filter: brightness(0.8); }
    }

    .shield-bar-fill { background: linear-gradient(90deg, #2563eb, #60a5fa); }
    .xp-bar-fill { background: linear-gradient(90deg, #00a880, #00f0b5); }
    .floor-bar-fill { background: linear-gradient(90deg, #ffb703, #ffd166); }

    /* Ouro In-Run Currency Counter & Telemetry */
    .hud-ouro-counter-wrap,
    .hud-xp-counter-wrap {
      display: inline-flex;
      align-items: center;
      margin-top: 2px;
      transition: all 0.2s ease-out;
    }

    .hud-ouro-badge,
    .hud-xp-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffd166;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.45);
      border-radius: 6px;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.7), 0 0 16px rgba(255, 183, 3, 0.4);
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.25), inset 0 0 6px rgba(255, 209, 102, 0.1);
      backdrop-filter: blur(4px);
    }

    .hud-ouro-val,
    .hud-xp-val {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 6px #ffd166, 0 0 12px #ffb703;
      letter-spacing: 0.03em;
    }

    /* Animated Level-Up Pulse and Ready Highlight */
    @keyframes levelUpPulse {
      0% {
        box-shadow: 0 0 6px rgba(255, 209, 102, 0.4), inset 0 0 4px rgba(255, 209, 102, 0.2);
        border-color: rgba(255, 209, 102, 0.6);
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        box-shadow: 0 0 16px rgba(255, 209, 102, 0.95), inset 0 0 8px rgba(255, 209, 102, 0.5);
        border-color: #ffd166;
        transform: scale(1.08);
        filter: brightness(1.35);
      }
      100% {
        box-shadow: 0 0 6px rgba(255, 209, 102, 0.4), inset 0 0 4px rgba(255, 209, 102, 0.2);
        border-color: rgba(255, 209, 102, 0.6);
        transform: scale(1);
        filter: brightness(1);
      }
    }

    .hud-lvl-badge.level-up-ready {
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.35), rgba(247, 37, 133, 0.35));
      border-color: var(--gold);
      color: #fff;
      animation: levelUpPulse 0.75s infinite ease-in-out;
      cursor: pointer;
    }

    .hud-ouro-counter-wrap.level-up-ready .hud-ouro-badge,
    .hud-xp-counter-wrap.level-up-ready .hud-xp-badge {
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.95), 0 0 20px rgba(255, 183, 3, 0.6);
      animation: levelUpPulse 0.75s infinite ease-in-out;
    }

    .hud-ouro-counter-wrap.level-up-ready .xp-bar-fill,
    .hud-xp-counter-wrap.level-up-ready .xp-bar-fill {

    .codex-panel {
      display: flex !important;
      flex-direction: column !important;
      width: min(94vw, 680px) !important;
      height: min(92vh, 92dvh) !important;
      max-height: 92dvh !important;
      padding: 0 !important;
      margin: auto !important;
      overflow: hidden !important;
      border-radius: 16px;
      background: rgba(5, 10, 20, 0.96);
      border: 1px solid rgba(0, 240, 181, 0.35);
      box-shadow: 0 0 35px rgba(0, 240, 181, 0.2), 0 20px 60px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      gap: 0 !important;
      text-align: left;
      touch-action: pan-y !important;
    }

    /* 2. Top Header (Fixed Top, Zero Overlap) */
    .codex-header {
      height: 52px;
      min-height: 52px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      background: rgba(10, 20, 38, 0.95);
      border-bottom: 1px solid rgba(0, 240, 181, 0.2);
    }

    .codex-header-title-group {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .codex-header-title-group h2,
    .codex-header .cyber-modal-title {
      font-size: clamp(13px, 3.2vw, 16px);
      font-weight: 700;
      text-align: center;
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #00f0b5 0%, #ffd166 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }

    .codex-header-title-group p,
    .codex-header-subtitle {
      margin: 2px 0 0 0;
      font-size: clamp(10px, 2vw, 12px);
      color: rgba(200, 225, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* Back Navigation Button */
    .btn-codex-back {
      min-height: 44px;
      min-width: 44px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      background: rgba(0, 240, 181, 0.15);
      border: 1px solid rgba(0, 240, 181, 0.45);
      color: #00f0b5;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-codex-back:hover {
      background: rgba(0, 240, 181, 0.25);
      border-color: #00f0b5;
      box-shadow: 0 0 12px rgba(0, 240, 181, 0.35);
    }

    .btn-codex-back:active {
      transform: scale(0.96);
      background: rgba(0, 240, 181, 0.35);
    }

    /* Top Close Button */
    .btn-close-top,
    .codex-header .btn-close-help {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #cbd5e1;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-close-top:hover,
    .codex-header .btn-close-help:hover {
      background: rgba(255, 51, 102, 0.25);
      border-color: rgba(255, 51, 102, 0.6);
      color: #ff3366;
    }

    .btn-close-top:active,
    .codex-header .btn-close-help:active {
      transform: scale(0.96);
      background: rgba(255, 51, 102, 0.35);
    }

    /* 3. Search Bar & Global Actions Toolbar */
    .codex-search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 16px 4px 16px;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .codex-search-wrap {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      min-height: 44px;
      height: 44px;
      background: rgba(10, 20, 36, 0.85);
      border: 1px solid rgba(0, 240, 181, 0.3);
      border-radius: 8px;
      padding: 4px 10px;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .codex-search-wrap:focus-within {
      border-color: #00f0b5;
      box-shadow: 0 0 14px rgba(0, 240, 181, 0.35);
    }

    .codex-search-icon {
      font-size: 15px;
      margin-right: 6px;
      opacity: 0.85;
      flex-shrink: 0;
    }

    .codex-search-input {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: clamp(12px, 2.8vw, 14px);
    }

    .codex-search-input::placeholder {
      color: rgba(200, 225, 255, 0.45);
      font-size: clamp(11.5px, 2.5vw, 13px);
    }

    .codex-search-clear {
      min-width: 44px;
      min-height: 44px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      font-size: 13px;
      padding: 0;
      flex-shrink: 0;
      transition: transform 0.1s ease, background 0.15s, color 0.15s;
    }

    .codex-search-clear:hover {
      background: rgba(255, 51, 102, 0.3);
      color: #ff3366;
    }

    .codex-search-clear:active {
      transform: scale(0.96);
      background: rgba(255, 51, 102, 0.4);
    }

    .codex-global-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-expand-all,
    .btn-collapse-all {
      min-height: 44px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
    }

    /* 4. Category Tabs Chip Bar */
    .codex-tab-bar-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px 16px 4px 16px;
      flex-shrink: 0;
      scrollbar-width: none;
      box-sizing: border-box;
    }

    .codex-tab-bar-wrap::-webkit-scrollbar {
      display: none;
    }

    .codex-tab-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: max-content;
    }

    .btn-codex-tab {
      min-height: 44px;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      background: rgba(15, 28, 52, 0.7);
      border: 1px solid rgba(0, 240, 181, 0.25);
      color: #cbd5e1;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-codex-tab:active {
      transform: scale(0.96);
    }

    .btn-codex-tab.active,
    .btn-codex-tab.btn-primary {
      background: rgba(0, 240, 181, 0.2);
      border-color: #00f0b5;
      color: #00f0b5;
      box-shadow: 0 0 12px rgba(0, 240, 181, 0.35);
      font-weight: 700;
    }

    .codex-tab-icon {
      font-size: 14px;
      line-height: 1;
    }

    .codex-tab-label {
      letter-spacing: 0.02em;
    }

    .codex-tab-badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(0, 240, 181, 0.25);
      border: 1px solid rgba(0, 240, 181, 0.4);
      color: #00f0b5;
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* 5. Telemetry & Results Counter Row */
    .codex-telemetry-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 16px 6px 16px;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .codex-results-count {
      font-size: 11px;
      font-weight: 600;
      color: rgba(0, 240, 181, 0.85);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .codex-hotkey-hint {
      font-size: 10.5px;
      color: rgba(148, 163, 184, 0.7);
    }

    .codex-kbd {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      padding: 1px 4px;
      font-family: monospace;
      font-size: 9px;
      color: #00f0b5;
    }

    /* 6. Center Scroll Area (Freely scrolling with zero double scrollbars) */
    .codex-scroll-container {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 1 auto !important;
      min-height: 0 !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y !important;
      padding: 14px 16px 80px 16px !important;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 240, 181, 0.5) rgba(4, 9, 18, 0.7);
      box-sizing: border-box !important;
      user-select: none;
      -webkit-user-select: none;
    }

    .codex-scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .codex-scroll-container::-webkit-scrollbar-track {
      background: rgba(4, 9, 18, 0.7);
      border-radius: 3px;
    }

    .codex-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 181, 0.5);
      border-radius: 3px;
      border: 1px solid rgba(0, 240, 181, 0.8);
    }

    /* 7. Level 1: Category Hub Grid & Hero Cards (Large thumb-friendly, min-height: 76px) */
    .codex-hub-header-label {
      font-size: clamp(11px, 2.2vw, 13px);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(0, 240, 181, 0.85);
      text-align: left;
      text-transform: uppercase;
      margin: 2px 0 0 2px;
    }

    .codex-hub-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    @media (min-width: 580px) {
      .codex-hub-grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
    }

    .codex-hub-card {
      flex: 0 0 auto !important;
      flex-shrink: 0 !important;
      min-height: 76px;
      height: auto !important;
      padding: 14px 16px;
      background: rgba(12, 24, 46, 0.75);
      border: 1px solid rgba(0, 240, 181, 0.28);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, background 0.18s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.18s, box-shadow 0.18s;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      box-sizing: border-box;
    }

    .codex-hub-card:hover {
      background: rgba(18, 38, 72, 0.95);
      border-color: #00f0b5;
      box-shadow: 0 0 20px rgba(0, 240, 181, 0.3);
      transform: translateY(-2px);
    }

    .codex-hub-card:active {
      transform: scale(0.96) !important;
      background: rgba(22, 46, 88, 1);
      border-color: #00f0b5;
      box-shadow: 0 0 24px rgba(0, 240, 181, 0.45);
    }

    .codex-hub-card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
    }

    .codex-hub-card-icon {
      font-size: clamp(24px, 6vw, 32px);
      line-height: 1;
      flex-shrink: 0;
    }

    .codex-hub-card-info {
      flex: 1 1 auto;
      min-width: 0;
    }

    .codex-hub-card-title {
      font-size: clamp(14px, 3.2vw, 16px);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .codex-hub-card-desc {
      font-size: clamp(11px, 2.4vw, 13px);
      color: rgba(200, 225, 255, 0.7);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .codex-hub-card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .codex-hub-card-badge {
      font-size: clamp(11px, 2vw, 12px);
      font-weight: 700;
      background: rgba(0, 240, 181, 0.15);
      border: 1px solid rgba(0, 240, 181, 0.35);
      color: #00f0b5;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .codex-hub-card-chevron {
      font-size: 14px;
      color: rgba(0, 240, 181, 0.8);
    }

    /* 8. Level 2: Stream / Article Cards (Sleek compact cards, min-height: 60px) */
    .codex-card {
      flex: 0 0 auto !important;
      flex-shrink: 0 !important;
      width: 100%;
      height: auto !important;
      min-height: 60px;
      background: rgba(10, 22, 42, 0.8);
      border: 1px solid rgba(0, 240, 181, 0.25);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      touch-action: pan-y !important;
      box-sizing: border-box !important;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .codex-card:hover {
      border-color: rgba(0, 240, 181, 0.45);
      box-shadow: 0 0 16px rgba(0, 240, 181, 0.15);
    }

    .codex-card.expanded {
      flex: 0 0 auto !important;
      flex-shrink: 0 !important;
      border-color: #00f0b5;
      box-shadow: 0 0 24px rgba(0, 240, 181, 0.3), 0 8px 32px rgba(0, 0, 0, 0.6);
      background: rgba(10, 22, 42, 0.95);
      height: auto !important;
      max-height: none !important;
      width: 100%;
      margin-top: 6px;
      margin-bottom: 16px;
    }

    .codex-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      min-height: 56px;
      cursor: pointer;
      user-select: none;
      background: rgba(15, 30, 58, 0.45);
      transition: background 0.15s ease;
      box-sizing: border-box;
    }

    .codex-card-header:hover {
      background: rgba(0, 240, 181, 0.08);
    }

    .codex-card-header:active {
      background: rgba(0, 240, 181, 0.15);
    }

    .codex-card-icon {
      font-size: 22px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }

    .codex-card-header-text {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
    }

    .codex-card-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .codex-card-title {
      margin: 0;
      font-size: clamp(13px, 2.8vw, 15px);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    .codex-tag-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .codex-tag {
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 240, 181, 0.14);
      color: #00f0b5;
      border: 1px solid rgba(0, 240, 181, 0.3);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .codex-card-subtitle {
      margin: 2px 0 0 0;
      font-size: clamp(11px, 2.2vw, 12px);
      color: rgba(200, 225, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .btn-accordion-toggle {
      min-width: 44px;
      min-height: 44px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #00f0b5;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }

    .btn-accordion-toggle:active {
      transform: scale(0.96);
    }

    .accordion-chevron {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .codex-card-body {
      display: none;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      touch-action: pan-y !important;
      padding: 16px !important;
      border-top: 1px solid rgba(0, 240, 181, 0.25);
      background: rgba(6, 14, 28, 0.95);
      font-size: clamp(12px, 2.5vw, 13.5px);
      line-height: 1.5;
      text-align: left;
      color: #e2e8f0;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    .codex-card-summary {
      font-weight: 600;
      color: #ffd166;
      margin-bottom: 10px;
      font-size: clamp(13px, 2.8vw, 15px);
      line-height: 1.45;
    }

    /* 9. Level 3: Article Reader & Typography (TL;DR banner, quick stats, bullet points, formula block) */
    .codex-detail-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      text-align: left;
      box-sizing: border-box;
    }

    .codex-body-section {
      width: 100%;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    .codex-golden-summary {
      width: 100%;
      background: rgba(255, 183, 3, 0.08);
      border: 1px solid rgba(255, 183, 3, 0.35);
      border-left: 4px solid #ffb703;
      box-shadow: 0 0 16px rgba(255, 183, 3, 0.2);
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffd166;
      font-size: clamp(12.5px, 2.8vw, 14.5px);
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 10px;
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .codex-stats-matrix {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
      width: 100%;
      box-sizing: border-box;
    }

    .codex-stat-pill {
      background: rgba(0, 240, 181, 0.12);
      border: 1px solid rgba(0, 240, 181, 0.3);
      color: #00f0b5;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .codex-tips-block {
      width: 100%;
      background: rgba(10, 24, 48, 0.6);
      border: 1px solid rgba(0, 240, 181, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 8px 0 16px 0;
      margin-bottom: 16px;
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .codex-detail-jumpers {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 240, 181, 0.15);
      box-sizing: border-box;
    }

    .btn-jumper-prev,
    .btn-jumper-next {
      min-height: 44px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      flex: 1 1 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 240, 181, 0.12);
      border: 1px solid rgba(0, 240, 181, 0.35);
      color: #00f0b5;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s, border-color 0.15s;
    }

    .btn-jumper-prev:active,
    .btn-jumper-next:active {
      transform: scale(0.96);
      background: rgba(0, 240, 181, 0.25);
    }

    /* 10. Formula Drawers & Rich Formatting */
    .codex-formula-drawer,
    .codex-formula-drawer[open] {
      width: 100%;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      overflow-y: visible !important;
      background: rgba(4, 9, 20, 0.95);
      border: 1px solid rgba(0, 240, 181, 0.35);
      border-left: 4px solid #00f0b5;
      border-radius: 8px;
      padding: 10px 14px;
      margin: 10px 0;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 240, 181, 0.15);
      box-sizing: border-box;
    }

    .formula-drawer-summary {
      cursor: pointer;
      color: #00f0b5;
      font-weight: 700;
      font-size: clamp(12px, 2.6vw, 14px);
      user-select: none;
      padding: 4px 0;
      outline: none;
    }

    .formula-block {
      width: 100%;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      background: rgba(8, 16, 32, 0.85);
      border: 1px solid rgba(0, 240, 181, 0.25);
      border-radius: 6px;
