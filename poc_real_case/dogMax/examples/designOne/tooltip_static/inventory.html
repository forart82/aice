<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DogMax — Item Tooltip (Static)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="tipwrap">
    <span class="tipcap">Weapon tooltip</span>
    <div class="tip rare">
      <div class="tiphead">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><path fill="rgba(220,220,235,0.16)" stroke="rgb(220,220,235)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22.6 16 H25.4 V44 H22.6 Z"></path><path fill="rgba(220,220,235,0.16)" stroke="rgb(220,220,235)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 8 H36 V19 H12 Z"></path><path fill="none" stroke="rgba(220,220,235,0.55)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" d="M14.5 9 V18 M33.5 9 V18"></path><circle fill="none" stroke="rgba(220,220,235,0.55)" stroke-width="1.1" cx="16.5" cy="13.5" r="1"></circle><circle fill="none" stroke="rgba(220,220,235,0.55)" stroke-width="1.1" cx="31.5" cy="13.5" r="1"></circle></svg>
        <div>
          <div class="tipname">Warhammer</div>
          <div class="tipsub sub-rare">RARE &#183; AOE &#183; EQUIPPED</div>
        </div>
      </div>
      <div class="tipbody">
        <div class="tiprow"><span>Damage</span><span>34-52</span></div>
        <div class="tiprow"><span>Attacks / sec</span><span>0.6</span></div>
        <div class="tiprow"><span>Range</span><span>Melee</span></div>
        <div class="tiprow"><span>Crit</span><span>8% &#215;2.5</span></div>
      </div>
    </div>
  </div>

  <div class="tipwrap">
    <span class="tipcap">Dice tooltip</span>
    <div class="tip rare">
      <div class="tiphead">
        <div class="die d-20"><span class="dn">20</span></div>
        <div>
          <div class="tipname">d20 Dice</div>
          <div class="tipsub sub-rare">RARE &#183; BLUE POWDER</div>
        </div>
      </div>
      <div class="tipbody">
        <div class="tiprow"><span>Faces</span><span>20</span></div>
        <div class="tiprow"><span>Held</span><span>&#215;3</span></div>
        <div class="tiprow"><span>Destroy yields</span><span>3 blue</span></div>
      </div>
    </div>
  </div>
</body>
</html>
