<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"/>

<body>
  <div class="stage">
    <div class="panel">
      <div class="titlebar"><span class="ttext">INVENTORY</span></div>

      <div class="toolbar">
        <div class="tabs">
          <span class="tab on">BY TIER</span><span class="tab">BY TYPE</span><span class="tab">BY VALUE</span>

        <span class="used">24 / 56</span>
      </div>

      <div class="main">

          <span class="plabel">DESTROY -&gt; POWDER</span>

            <div class="shard"></div>
            <div class="pbtext"><span class="pn">COMMON</span><span class="pd">destroy x4</span></div>
          </button>
          <button class="pbtn t-uncommon">
            <div class="shard"></div>
            <div class="pbtext"><span class="pn">UNCOMMON</span><span class="pd">destroy x6</span></div>
          </button>
          <button class="pbtn t-rare">
            <div class="shard"></div>
            <div class="pbtext"><span class="pn">RARE</span><span class="pd">destroy x4</span></div>
          </button>
          <div class="ptotal"><span class="plabel">POWDER</span><span class="ptotaln">803</span></div>

            <div class="prow"><span class="pdot" style="background:#b450f0;"></span><span class="pname">PURPLE</span><span class="pcount">30</span></div>
            <div class="prow"><span class="pdot" style="background:#ffa028;"></span><span class="pname">ORANGE</span><span class="pcount">18</span></div>

            <div class="prow"><span class="pdot" style="background:#f0f0f0;"></span><span class="pname">WHITE</span><span class="pcount">12</span></div>
            <div class="prow"><span class="pdot" style="border:1px #7a8296 solid;" style="background:#2c2c34;"></span><span class="pname">BLACK</span><span class="pcount">31</span></div>
          </div>
        </div>

        <div class="grid">

          <div class="cell weapon t-rare selected"><div class="slot"></div><div class="seam"></div><div class="wico"><img class="wpn" src="icons/warhammer.svg"/></div><div class="corner"></div><div class="eq"></div></div>
          <div class="cell t-rare"><div class="slot"><div class="die d-20"><span class="dn">20</span></div></div><div class="corner"></div></div>
          <div class="cell t-common"><div class="slot"><div class="die d-6"><span class="dn">6</span></div></div><div class="corner"></div></div>

        <div class="col">
