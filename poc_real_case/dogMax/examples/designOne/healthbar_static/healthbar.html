<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DogMax — Health Bar (Static)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel">
    <span class="cap">Hero HUD · level + HP ramp</span>
    <div class="hudrow"><span class="cap">Healthy</span>        <div class="bar-line">
          <span class="lvl">27</span>
          <div class="hp healthy">
            <div class="fill"></div>
            <div class="label">700 / 850 HP</div>
            <span class="leg h t l"></span><span class="leg v t l"></span><span class="leg h t r"></span><span class="leg v t r"></span><span class="leg h b l"></span><span class="leg v b l"></span><span class="leg h b r"></span><span class="leg v b r"></span>
          </div>
        </div></div>
    <div class="hudrow"><span class="cap">Wounded</span>        <div class="bar-line">
          <span class="lvl">27</span>
          <div class="hp wounded">
            <div class="fill"></div>
            <div class="label">323 / 850 HP</div>
            <span class="leg h t l"></span><span class="leg v t l"></span><span class="leg h t r"></span><span class="leg v t r"></span><span class="leg h b l"></span><span class="leg v b l"></span><span class="leg h b r"></span><span class="leg v b r"></span>
          </div>
        </div></div>
    <div class="hudrow"><span class="cap">Critical</span>        <div class="bar-line">
          <span class="lvl">27</span>
          <div class="hp critical">
            <div class="fill"></div>
            <div class="label">119 / 850 HP</div>
            <span class="leg h t l"></span><span class="leg v t l"></span><span class="leg h t r"></span><span class="leg v t r"></span><span class="leg h b l"></span><span class="leg v b l"></span><span class="leg h b r"></span><span class="leg v b r"></span>
          </div>
        </div></div>
  </div>
</body>
</html>
