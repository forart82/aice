# One-shot effect bursts on state transitions (visual_identity.md Step 11).
#
# The effects library shipped with 100 catalog entries and a working renderer,
# but nothing in the game ever emitted into it — the whole engine was dead
# weight. These keys wire the moments worth marking to catalog entries that
# already exist, rather than authoring new effect art.
#
# Names must match an EFX_*_NAME in configs/effects/. An empty name disables
# that burst. Radius is in world pixels; 0 falls back to the catalog default.
#
# Colours are NOT set here: each burst is tinted at the call site with the
# colour of whatever caused it — the hero's orange, the dying enemy's own tier
# hue — so bursts stay inside the locked three-hue palette automatically and
# cannot drift out of it as tiers are re-tuned.

# Hero lands a hit. Small and quick: this fires constantly in combat, so it has
# to read as punctuation, not as an event.
BURST_HERO_HIT_NAME: hit_flash
BURST_HERO_HIT_RADIUS: 46

# Hero takes a hit. Larger than the hit the hero deals — being hit is the more
# important thing for the player to notice, and it happens far less often.
BURST_HERO_HURT_NAME: shockwave
BURST_HERO_HURT_RADIUS: 90

# Enemy dies. The biggest of the three: a kill is the payoff moment, and it is
# the one burst that should still read clearly in a crowded fight.
BURST_ENEMY_DEATH_NAME: explosion_ring
BURST_ENEMY_DEATH_RADIUS: 110
