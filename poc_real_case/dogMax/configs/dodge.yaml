# card-mpkz662b part 1b — active Doge (Space-key dash) tunables.
#
# DODGE_MAX_CHARGES is the size of the dash pool at run start. The
# user spec asks for "two charges at the start" — bump or shrink to
# tune the rhythm.
# DODGE_CHARGE_COOLDOWN_SECONDS is the wall-clock gap between refills
# when the player burns at least one charge. Refills are pool-wide:
# burn both charges back-to-back, the first refill arrives one
# cooldown later, the next arrives a second cooldown after that.
# DODGE_DASH_DURATION_SECONDS pins how long the velocity override
# holds. With DODGE_DASH_SPEED = 800 and 0.18s duration the dash
# covers ~144 world units — about 2× the default hero collision
# radius per chained dash. Tweak both to taste; the spec is loose on
# numbers.
DODGE_MAX_CHARGES: 2
DODGE_CHARGE_COOLDOWN_SECONDS: 2.0
# card-dash-important — the dash is now a major combat ability, not just
# repositioning. Bigger reach: 1150 px/s over 0.22 s covers ~253 world
# units per dash (was ~144), so a single dash clears real space.
DODGE_DASH_DURATION_SECONDS: 0.22
DODGE_DASH_SPEED: 1150.0

# card-dash-iframes — invulnerability window armed by every dash. Covers
# the 0.22 s burst plus a ~0.13 s landing buffer so the dash reads as a
# clean i-frame escape through an enemy or projectile, not just a
# reposition. While this window is up the hero takes zero damage.
DODGE_DASH_IFRAME_SECONDS: 0.35

# card-dash-through — dashing THROUGH an enemy now hurts it. An enemy
# whose body centre falls within DODGE_DASH_DAMAGE_RADIUS world units of
# the hero during the dash takes DODGE_DASH_DAMAGE_FRAC of its own max
# health (once per dash) and is knocked DODGE_DASH_KNOCKBACK world units
# along the dash heading. Turns the dash into an offensive gap-closer +
# crowd-shove on top of the defensive i-frames.
DODGE_DASH_DAMAGE_RADIUS: 90.0
DODGE_DASH_DAMAGE_FRAC: 0.30
DODGE_DASH_KNOCKBACK: 120.0

# card-dash-vfx — motion-streak afterimage. While the hero is dashing, a
# row of DODGE_DASH_TRAIL_IMAGES bright copies is drawn between the dash
# start point and the hero's live position, fading from the configured
# colour/alpha at the tail to nothing at the hero, so a dash reads as a
# loud streak rather than a single faint ghost. Pure VFX — no gameplay
# effect — proven on screen by a framebuffer pixel sample on the streak.
DODGE_DASH_TRAIL_IMAGES: 6
DODGE_DASH_TRAIL_R: 90
DODGE_DASH_TRAIL_G: 235
DODGE_DASH_TRAIL_B: 255
DODGE_DASH_TRAIL_ALPHA: 175

