# enemy_shapes.yaml — clean minimalist ABSTRACT enemy silhouettes.
#
# Each shape is a closed, straight-edged polygon generated by
# render::buildEnemyShapeOutline. Symmetry is GUARANTEED by construction:
# radial forms (polygon/star/cross) repeat exactly around the centre; bilateral
# forms are built as a right half and mirrored about the vertical axis. The set
# is deliberately spare and graphic — instantly-readable abstract glyphs, each
# distinct. Previewed in the Ctrl+E gallery; the single source the future
# "wire to live enemies" card draws from.
#
# Per-shape keys (NN = 00..59 across this file and enemy_shapes_extra.yaml):
#   SHAPE_NN_NAME          display label
#   SHAPE_NN_FORM          polygon | star | cross | arrow | kite | shield |
#                          wedge | hourglass | drop | lens | gem
#   SHAPE_NN_N             polygon side count / star point count
#   SHAPE_NN_INNER         star inner-radius ratio / cross arm thickness (0..1)
#   SHAPE_NN_ASPECT        bilateral vertical stretch (1 = none)
#   SHAPE_NN_ROTATION_DEG  radial phase offset in degrees
#   SHAPE_NN_CORE          accent core/eye radius fraction (0 = none)

# NOTE: Tab 3 (Cosmic, SHAPE_40..59) lives in enemy_shapes_extra.yaml to keep
# each shape set focused. ConfigLoader merges every configs/*.yaml, so the full
# SHAPE_00..59 set (ENEMY_SHAPE_COUNT below) is still resolved at load time.
ENEMY_SHAPE_COUNT: 63
# Tab split counts (Tab1=Primordial 0..19, Tab2=Mech 20..39, Tab3=Cosmic 40..59)
ENEMY_SHAPE_TAB1_COUNT: 20
ENEMY_SHAPE_TAB2_COUNT: 20
ENEMY_SHAPE_TAB3_COUNT: 20

