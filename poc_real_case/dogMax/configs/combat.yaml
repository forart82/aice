# Combat tick + damage text styling.
# (Crit chance / multiplier are sourced per-weapon from weapon.config +
# slotted dice, per spec L1586-1587 — there is no global crit base.)

# SE7 / spec L1598 — hard cap on effective crit chance after dice +
# per-level + archetype contributions are summed. Without the cap a
# late-game stack of high-luck Rare dice could saturate at 1.0+ so
# every hit was critical, collapsing the design space; 0.75 keeps
# critical hits a meaningful event even on a max stack.
CRIT_CHANCE_CAP: 0.75

# Damage-formula floors (dof::combat::computeDamage). DICE_PRODUCT_FLOOR is
# the minimum the product of all slotted dice damage-multipliers is clamped
# to before it scales base damage — it stops a stack of sub-1.0 multipliers
# from zeroing a hit. MINIMUM_FLOOR is the floor on the final rolled damage
# so every landed hit deals at least this much. Both are passed explicitly
# into computeDamage/rollWeaponDamage (no in-code defaults — a caller that
# omits them fails to compile).
DAMAGE_DICE_PRODUCT_FLOOR: 0.1
DAMAGE_MINIMUM_FLOOR: 1.0

DAMAGE_TEXT_DURATION: 1.0
# SA46 / spec §Appendix J L4234 — damage-text vertical drift speed
# in pixels-per-second (NOT total-pixels-over-lifetime, which the
# old `DAMAGE_TEXT_RISE_PIXELS` key implied). At the default
# duration of 1.0 s this still yields 80 px of rise, so the visual
# is unchanged today; the new semantic makes the value independent
# of duration tweaks (a longer duration no longer slows the float).
DAMAGE_TEXT_MOVE_SPEED: 80

# SA21 / spec §Appendix J L4235: horizontal jitter at spawn time so
# stacked hits on the same enemy don't render perfectly on top of one
# another. Spec literal is the unitless interval `U[−0.5, 0.5]`; this
# key is the pixel half-range — each spawn draws
# `uniformFloat(-jitter, +jitter)` and adds it to worldPosition.x.
# 12 px sits well below the smallest font size (16 px) so adjacent
# numbers shift but remain inside the readable column over the enemy.
DAMAGE_TEXT_HORIZONTAL_JITTER: 12.0

# Spec §Damage Text + §Appendix J: three visual tiers driven by the
# damage value itself (independent of the boolean crit flag, which
# still appends a "!" suffix to the text). Normal is white at the
# baseline font size; Heavy bumps to the larger font with an
# orange-amber tint; Critical reuses the larger font with a hot-red
# tint. Thresholds are inclusive on the lower bound: amount >= 30 is
# Critical, amount in [15, 30) is Heavy, else Normal.
DAMAGE_TEXT_HEAVY_THRESHOLD: 15
DAMAGE_TEXT_CRITICAL_THRESHOLD: 30

DAMAGE_TEXT_FONT_SIZE: 16
DAMAGE_TEXT_HEAVY_FONT_SIZE: 22
DAMAGE_TEXT_CRIT_FONT_SIZE: 22

DAMAGE_TEXT_COLOR_R: 240
DAMAGE_TEXT_COLOR_G: 240
DAMAGE_TEXT_COLOR_B: 240
DAMAGE_TEXT_HEAVY_COLOR_R: 255
DAMAGE_TEXT_HEAVY_COLOR_G: 180
DAMAGE_TEXT_HEAVY_COLOR_B: 60
DAMAGE_TEXT_CRIT_COLOR_R: 255
DAMAGE_TEXT_CRIT_COLOR_G: 60
DAMAGE_TEXT_CRIT_COLOR_B: 60

# SA19 / spec §Quality §Tier Visual L1798: blend factor between the
# damage-amount tier base colour (Normal / Heavy / Critical) and the
# source-item Quality tier palette (theme.tierCommon / tierUncommon /
# tierRare). 0.0 = no tint (amount tier only); 1.0 = full tier tint.
# Sensible default sits low enough that the amount-tier signal stays
# dominant — a heavy hit from a Rare weapon still reads as orange-ish,
# just with a magenta hint, instead of pure tier magenta.
DAMAGE_TEXT_QUALITY_TINT_BLEND: 0.30

# ---------------------------------------------------------------------------
# Hit-stop — impact freeze (visual_identity.md Step 8)
# ---------------------------------------------------------------------------
# A brief freeze of the whole simulation the moment a hit lands, so an attack
# reads as a collision instead of the attacker sliding through the target.
#
# Durations are in REAL seconds, not simulation seconds: while frozen the
# simulation does not step at all, so the countdown has to run on wall time or
# it could never expire.
#
# Roughly 2-4 frames at 60 Hz. This is the whole budget — long enough for the
# eye to register the stop, short enough that it never reads as a stutter or
# eats input. Requests are max-wins in HitStop, so a swipe landing on six
# enemies in one frame freezes once rather than six times.
HIT_STOP_DEALT_SECONDS: 0.045

# Taking a hit stops harder than dealing one: it is the more important event
# for the player to notice, and it is rarer. Scaled at the call site by the
# same HERO_INCOMING_HIT_*_STRENGTH scalar that already drives the incoming-hit
# feedback, so a crit lands heavier than a graze without a second set of keys.
HIT_STOP_TAKEN_SECONDS: 0.070

# Hero attack anticipation (visual_identity.md Step 9).
#
# A charged weapon row waits this long before it commits, so an attack has a
# readable wind-up beat rather than materialising on the frame it charges.
#
# Costs no responsiveness: hero rows auto-fire on their own cooldown, not on a
# keypress, so this delays a timer the player never sees. The same delay on a
# player-triggered attack would read as input lag.
#
# Deliberately shorter than the enemy telegraph (ENEMY_ARMED_ATTACK_WINDUP_SECONDS):
# an enemy wind-up is information the player must react to, while the hero's is
# presentation, and a long one would visibly cut damage output.
HERO_ATTACK_WINDUP_SECONDS: 0.07
