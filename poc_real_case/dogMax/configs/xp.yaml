# Hero XP / leveling tunables. Read by Hero at construction.
#
# Spec: GameDesign.md §Leveling & XP + §Appendix A — XP Step Costs.
# Step costs HERO_XP_LEVEL_N give the XP needed to advance from level N to
# level N+1. Stored as int64 (late-game values from L90+ exceed 32-bit int max).
#
# XP grant formula on enemy kill:
#   delta     = enemy.level - hero.level
#   deltaMult = clamp(1 + delta * XP_DELTA_SCALE, XP_DELTA_MIN, XP_DELTA_MAX)
#   xp        = floor(enemy.level^2 * qualityMult * deltaMult)
#
# card-mpo9q5ih — XP_DELTA_MIN now floors at 1.0 so the level-diff
# modifier can only RAISE the grant above the per-level baseline,
# never reduce it below. Players reported zero-XP kills when the
# hero out-levelled the enemy by 10+ levels (deltaMult clamped to 0.1
# made low-level enemies feel like a waste); the new floor pins the
# Common-tier baseline (`enemy.level^2 * qualityMult`) as a hard
# lower bound and keeps the [1.0, 2.0] window symmetric — the upside
# is unchanged so high-level kills still grant 2× XP.

XP_DELTA_SCALE: 0.1
XP_DELTA_MIN: 1.0
XP_DELTA_MAX: 2.0

# card-mpl0eo9k — per-tier XP multiplier matches the enemy stat
# multiplier ladder (ENEMY_TIER_STAT_MULT_* = 1.0 / 3.0 / 9.0). An
# Uncommon enemy is 3× tougher than a Common; killing one should
# reward 3× the XP. A Rare is 9× tougher and 9× as rewarding. This
# replaces the earlier compressed 1.0 / 1.4 / 2.0 curve that left
# Uncommon / Rare drops feeling like cosmetic upgrades instead of
# the order-of-magnitude jumps the spec stat ladder implies.
XP_QUALITY_MULT_COMMON: 1.0
XP_QUALITY_MULT_UNCOMMON: 3.0
XP_QUALITY_MULT_RARE: 9.0

# card-mpl0eo9k — rolling-window kill-streak XP multiplier. Each
# enemy killed within `WINDOW_SECONDS` of the previous kill bumps the
# multiplier by `BONUS_PER_KILL`, capped at `MAX_MULT`. A gap longer
# than the window resets the streak to 1× (single-kill baseline). The
# boosted amount is what both the XP bar and the on-screen "+N XP"
# float report, so the player gets immediate feedback on the combo.
XP_KILL_STREAK_WINDOW_SECONDS: 3.0
XP_KILL_STREAK_BONUS_PER_KILL: 0.25
XP_KILL_STREAK_MAX_MULT: 3.0

# Floating "+N XP" feedback. card-mpl8zfv4 moved the spawn position
# from the hero to the dying enemy so the player reads the kill site
# directly; the streak palette below colours chained kills (within
# XP_KILL_STREAK_WINDOW_SECONDS) and bumps the font size per chain
# step up to a configurable cap.
XP_FLOAT_DURATION: 1.0
XP_FLOAT_RISE_PIXELS: 80
XP_FLOAT_FONT_SIZE: 20
XP_FLOAT_COLOR_R: 120
XP_FLOAT_COLOR_G: 210
XP_FLOAT_COLOR_B: 255

# card-mpl8zfv4 — streak visuals. When `XpFloatHub::spawnXp` is
# called with `streakIndex >= 2`, the float renders in the streak
# palette (gold) and the font size scales up by
# `STREAK_FONT_SIZE_BUMP_PER_KILL` per chained kill, capped at
# `STREAK_MAX_FONT_SIZE`. A streak of 1 (first kill / no chain)
# falls back to the baseline colour + font size above.
XP_FLOAT_STREAK_COLOR_R: 255
XP_FLOAT_STREAK_COLOR_G: 215
XP_FLOAT_STREAK_COLOR_B: 80
XP_FLOAT_STREAK_FONT_SIZE_BUMP_PER_KILL: 3
XP_FLOAT_STREAK_MAX_FONT_SIZE: 40

# XP step table — 40-hour playthrough target. Spec §Appendix A L3823-3845.
# The first three steps are intentionally hand-tuned below the long-run formula
# so a new run reaches level 2 quickly and shows the level-up feedback early.
# L4+ keeps the existing long-run pacing table.
# Phase 1 (L1-39): kills(N) = 300 * 1.0705^(N-1); step(N) = round(kills * N^2).
# Phase 2 (L40-99): step(N) = round(step(39) * 1.06^(N-39)) — a pure geometric
# ramp ANCHORED at the Phase-1 endpoint so the two phases join without a cliff.
#
# card-P1.4 — fixed a discontinuous, non-monotonic pivot. The old Phase 2
# restarted kills from a base of 400 (step(40) = 400 * 40^2 = 640 000), a 9.5x
# DROP below step(39) = 6 074 968. That made L40 a brutal wall while L40->41 was
# suddenly trivial. Phase 2 is now re-anchored at step(39) and grows geometrically
# at g = 1.06/level, so step(40) >= step(39) (pivot ratio 1.06 — a gentle easing
# from the 1.128 that precedes it, NOT a cliff) and step(n+1) >= step(n) for every
# n up to 99. The N^2 shaping is intentionally DROPPED in Phase 2: with the 6.07M
# anchor it would explode late-game grind far past the 40 h budget, and its absence
# lets same-level kills/level taper (step/N^2 grows sub-geometrically) — exactly the
# "gentler late-game than early" intent (Phase 1 step ratios run 4.28x -> 1.128x;
# Phase 2 is a flat 1.06x, gentler than every Phase-1 step).
#
# Spot-check waypoints (opening ramp hand-tuned; Phase 2 re-tabled):
#   L1   =          30
#   L10  =      55 386
#   L20  =     437 853
#   L40  =   6 439 466 (phase pivot — now CONTINUOUS/monotonic; was 640 000 cliff)
#   L60  =  20 652 240
#   L80  =  66 234 532
#   L99  = 200 399 166 (largest step; no dip anywhere in L1..L99; fits int64)
#
# Cumulative XP L1->L99 = 3 481 694 005. Same-level kills to L99 baseline ~596 600
# (vs the old buggy ~460 000 — the cheap post-pivot shortcut is gone). At sustained
# 2 kills/sec that's ~83 h pure same-level grinding; in practice the player walks
# outward, enemies out-level the hero, deltaMult caps at 2.0 and qualityMult adds
# ~1.4-2.0x -> effective ~40-45 h to L99 active combat, matching the 40-hour
# playthrough budget (slack for loot churn / dron events / meta progression).
HERO_XP_LEVEL_1: 30
HERO_XP_LEVEL_2: 180
HERO_XP_LEVEL_3: 420
HERO_XP_LEVEL_4: 5888
