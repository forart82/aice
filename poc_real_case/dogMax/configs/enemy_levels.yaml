# SE1 — Distance-step curve. Spec §Level System L549-555 (piecewise).
#
# Replaces the flat `ENEMY_LEVEL_DISTANCE_STEP` constant with a
# piecewise schedule so the 40-hour playable target is reachable.
# Three bands stitched together to land cum[99] inside the
# spec-pinned 28-30 M px band:
#
#   L2..L10  linear  step = LINEAR_STEP                     (≈ first 6 h walked)
#   L11..L40 exp     step(N) = LINEAR_STEP * EXP1_FACTOR^(N-LINEAR_END)
#                                                            (≈ first 14 h)
#   L41..L99 exp     step(N) = step(40)  * EXP2_FACTOR^(N-EXP1_END)
#                                                            (≈ 38-40 h)
#
# **Spec discrepancy logged** — the spec text proposes `EXP2_FACTOR = 1.05`
# in the same paragraph that pins cum[99] ≈ 28-30 M; the two are
# mutually exclusive (1.05^59 ≈ 17.8 makes cum[99] ≈ 110 M, ~4× the
# stated target). The user-confirmed resolution is to honour the
# stated INTENT (28-30 M ≈ 38-40 h playable target) by tuning the
# factor down to 1.01. With these defaults:
#
#   cum[10] ≈ 270 000 px      (~6 h)
#   cum[40] ≈ 3.94 M px       (~14 h)
#   cum[99] ≈ 28.3 M px       (~40 h)
#
# Retune any of the five keys and the runtime curve picks the new
# values up without a rebuild; `EnemyLevelCurve::loadFromConfig`
# rebuilds the cumulative table from these alone.

ENEMY_LEVEL_LINEAR_STEP: 30000
ENEMY_LEVEL_LINEAR_END: 10
ENEMY_LEVEL_EXP1_FACTOR: 1.08
ENEMY_LEVEL_EXP1_END: 40
ENEMY_LEVEL_EXP2_FACTOR: 1.01
ENEMY_LEVEL_MAX: 99
