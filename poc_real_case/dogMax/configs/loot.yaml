# Loot Pipeline tunables (spec §Loot Pipeline Overview).
#
# Stage 1 — Weapon vs Dice integer ratio. Equal weights produce a 50/50
# split; raise one to bias the pool. They are integers, not probabilities.
WEAPON_DROP_WEIGHT: 50000
DICE_DROP_WEIGHT: 50000

# Per-stat safety floors applied after playable quality scaling. The quality
# factor itself retains at least QUALITY_STAT_FACTOR_MIN of each base stat;
# these clamps protect malformed or unusually low type bases as a final guard.
WEAPON_DAMAGE_FLOOR: 5
WEAPON_APS_FLOOR: 0.01
WEAPON_RANGE_FLOOR: 50
WEAPON_CRIT_MULT_FLOOR: 1.0
# Range uses level^P scaling so it stays playable at high levels.
# WEAPON_RANGE_LEVEL_POWER=0.2 → long weapon (600): Lv1=600, Lv100~=1500.
# (level^0.2: Lv1=1.0, Lv25=1.90, Lv50=2.19, Lv100=2.51 — gentle curve.)
# Damage/APS keep the linear level formula (power implicitly = 1.0).
WEAPON_RANGE_LEVEL_POWER: 0.2

DICE_DAMAGE_MULT_FLOOR: 0.5
DICE_CRIT_FLOOR: 0.5
DICE_CRIT_CHANCE_FLOOR: 0.0
DICE_EVASION_PER_SLOT_FLOOR: 0.0

# Drop Chance — f(player luck, enemy tier).
#
# Replaces the old flat ENEMY_BONUS_DROP_CHANCE / ELITE_BONUS_DROP_CHANCE
# (spec §Bonus Drop L2008-2009) with a formula that rewards investing in
# luck dice and hunting stronger enemies. The guaranteed base drop is also
# removed; every kill is chance-gated so low-luck / low-tier play drops
# fewer items while a lucky, well-geared player farming Rare enemies
# approaches the 0.95 cap.
#
#   luckNorm  = clamp(luckTotal / LUCK_DROP_REFERENCE, 0, 1)
#   tierNorm  = enemyTierIndex / 2  (0=Common, 0.5=Uncommon, 1=Rare)
#   dropChance = clamp(BASE + LUCK_BONUS*luckNorm + TIER_BONUS*tierNorm, 0, MAX)
#
# Reference calibration (luckTotal 100 ≈ saturated):
#   Low luck, Common enemy  : 0.25 + 0    + 0    = 0.25
#   Mid luck, Uncommon      : 0.25 + 0.25 + 0.15 = 0.65
#   Max luck, Rare enemy    : 0.25 + 0.50 + 0.30 = 1.05 → clamped to 0.95
#
# Elites receive ELITE_DROP_COUNT_BONUS guaranteed extra drops on top of
# the chance roll (Stage 4 below).
BASE_DROP_CHANCE: 0.25
LUCK_DROP_BONUS: 0.50
TIER_DROP_BONUS: 0.30
MAX_DROP_CHANCE: 0.95
LUCK_DROP_REFERENCE: 100

# Stage 4 — Elite Extras (spec §Elite Extra Drops L2017). Every Elite
# enemy grants this many guaranteed extra drops on top of the base chance
# roll. 1 extra gives Elites 1.95 average drops at max luck+tier vs 0.95
# for commons — a meaningful but not overwhelming bonus.
ELITE_DROP_COUNT_BONUS: 1

# Per-stat Quality Bias — enemy tier lifts the lower bound of each
# independent stat quality roll.
#
# biasFloor = clamp(qFloor + TIER_STAT_BIAS * enemyTierIndex, 0, 99)
# Each stat rolls q_stat ~ U[biasFloor, 100] independently.
#
# With TIER_STAT_BIAS: 25:
#   Common enemy  (tier 0): biasFloor = qFloor + 0  (luck only)
#   Uncommon      (tier 1): biasFloor = qFloor + 25 (luck + small bonus)
#   Rare          (tier 2): biasFloor = qFloor + 50 (luck + strong bonus)
# Clamped to 99 so a Rare enemy never forces a 100/100 roll — variance
# still exists even from the best sources.
TIER_STAT_BIAS: 25

# Stage 2b — Drop Weights — Slot Count (spec §Loot L2036-L2069).
# Integer weights per slot-count tier (2..6). Base distribution is
# heavily skewed toward 2-slot drops; 6-slot weapons are trophies.
DROP_WEIGHT_WEAPON_SLOTS_2: 4000
DROP_WEIGHT_WEAPON_SLOTS_3: 30
DROP_WEIGHT_WEAPON_SLOTS_4: 15
DROP_WEIGHT_WEAPON_SLOTS_5: 2
DROP_WEIGHT_WEAPON_SLOTS_6: 1

# Weapon slot-count clamp bounds (spec §Loot L2038: "Slot range is 2..6").
# The inclusive [min, max] a rolled or overridden weapon slot count is
# clamped to before it reaches the slot grid. The Weapon entity is
# ConfigLoader-free by design, so these bounds live here for the WeaponMaker
# slot-count path to source and apply (Weapon::setSlotCount currently clamps
# to the same 2..6 literals until that wiring lands).
WEAPON_SLOT_COUNT_MIN: 2
WEAPON_SLOT_COUNT_MAX: 6

# Stage 2b — Slot-count modulation (spec L2056-L2065). Per slot tier
# `n`, the effective weight is
#   base[n] * (1 + α·qNorm + β·lvlNorm + γ·luckNorm)^(n - 2)
# qNorm   = q / 100
# lvlNorm = (itemLevel - 1) / 98   (99-step item-level table, L1 = 0, L99 = 1)
# luckNorm = clamp(luckTotal / WEAPON_SLOT_COUNT_LUCK_REFERENCE, 0, 1)
# The exponent `(n - 2)` keeps the 2-slot floor unchanged and lifts
# every higher tier geometrically as inputs grow.
WEAPON_SLOT_COUNT_QUALITY_ALPHA: 0.3
WEAPON_SLOT_COUNT_LEVEL_BETA: 0.5
WEAPON_SLOT_COUNT_LUCK_GAMMA: 0.4
WEAPON_SLOT_COUNT_LUCK_REFERENCE: 100
