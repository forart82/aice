# Pickup sound feedback. This is deliberately one fixed SFX for every pickup.
PICKUP_SOUND_PATH: assets/audio/pickup.wav
PICKUP_SOUND_VOLUME: 72

# Glorious level-up accent. Triggered only when the hero level increases during
# a run, not on the initial level-1 visual seed.
LEVEL_UP_SOUND_PATH: assets/audio/level_up.wav
LEVEL_UP_SOUND_VOLUME: 82

# Positional cyberpunk SFX. All buffers are mono so SFML can spatialize them
# around the hero listener: nearby events are louder, distant events fade, and
# left/right direction follows the event's world position.
SPATIAL_SOUND_MIN_DISTANCE: 280
SPATIAL_SOUND_MAX_DISTANCE: 2600
SPATIAL_SOUND_ATTENUATION: 1.15
SPATIAL_SOUND_MIN_GAIN: 0.05
SPATIAL_SOUND_MAX_ACTIVE: 96

SFX_PORTAL_OPEN_PATH: assets/audio/sfx_portal_open.wav
SFX_PORTAL_OPEN_VOLUME: 78
SFX_PORTAL_CLOSE_PATH: assets/audio/sfx_portal_close.wav
SFX_PORTAL_CLOSE_VOLUME: 74

