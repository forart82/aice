ITEM_BLINK_ALPHA_BASE: 0.7
ITEM_BLINK_ALPHA_AMP: 0.3
ITEM_PICKUP_RADIUS: 360

# SA6 — Attack Types per weapon type. Spec §Attack L1437-1582 +
# §Weapons L782-1008. Values:
#   SINGLE       — closest target only (Pitchfork)
#   SWIPE        — arc sweep, hits enemies inside <TYPE>_SWIPE_ARC_DEG cone
#   MULTITARGET  — N nearest enemies, independent crit rolls
#   MULTISINGLE  — N hits stacked on closest, single summed damage text
#   AOE          — every enemy inside range, single damage roll replicated
# Pitchfork = Single. LongSword/GreatSword = Swipe (arc sweep).
# Halberd/Quarterstaff = AOE (360° spin — distinct VFX from hammers).
# Knives = MultiTarget(4). Dagger = MultiSingle(3).
# Mace/Warhammer/BigAxe = AOE (smash or pulse VFX by weaponTypeHint).
PITCHFORK_ATTACK_TYPE: SINGLE
LONG_SWORD_ATTACK_TYPE: SWIPE
GREAT_SWORD_ATTACK_TYPE: SWIPE
HALBERD_ATTACK_TYPE: AOE
QUARTERSTAFF_ATTACK_TYPE: AOE
KNIVES_ATTACK_TYPE: MULTITARGET
DAGGER_ATTACK_TYPE: MULTISINGLE
MACE_ATTACK_TYPE: AOE
WARHAMMER_ATTACK_TYPE: AOE
BIG_AXE_ATTACK_TYPE: AOE

# Swipe arc angles per spec L856-902 (full cone width in degrees, not
# half-angle). Pitchfork has no swipe but key kept for symmetry; Knives
# and Dagger and the 4 AOEs are not Swipe so their arc keys are unused
# at runtime — included for completeness so a future config edit can
# convert a weapon without code changes.
PITCHFORK_SWIPE_ARC_DEG: 0
LONG_SWORD_SWIPE_ARC_DEG: 90
GREAT_SWORD_SWIPE_ARC_DEG: 180
HALBERD_SWIPE_ARC_DEG: 180
QUARTERSTAFF_SWIPE_ARC_DEG: 45
KNIVES_SWIPE_ARC_DEG: 0
DAGGER_SWIPE_ARC_DEG: 0
MACE_SWIPE_ARC_DEG: 0
WARHAMMER_SWIPE_ARC_DEG: 0
BIG_AXE_SWIPE_ARC_DEG: 0

