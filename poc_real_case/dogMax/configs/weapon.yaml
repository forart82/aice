# SA16 — Weapon per-level multipliers. Spec §Weapon Per-Level Multipliers
# L1873-1877 canonical table (REVISED 40-hour pacing). Pulled from
# 1.15 / 1.10 / 1.05 / 1.20 / 1.15 to spec 1.10 / 1.10 / 1.05 / 1.10 /
# 1.15 — the previous 1.15 damage factor saturated too fast vs enemy
# HP 1.12, letting hero L40+ one-shot through the late-game chase. Spec
# 1.10 keeps the curve compounding through the universal `m` (quality
# x level), dice damageMultiplier, and dron stacks, so endgame DPS
# growth comes from gear acquisition (loot pipeline) rather than the
# raw level-up tick. The 1.20 critChance ramp also saturated to 100 %
# by L20 with any nonzero base — 1.10 keeps crit a meaningful build
# dimension across the full 40 h.
WEAPON_DAMAGE_PER_LEVEL: 1.10
WEAPON_APS_PER_LEVEL: 1.10
WEAPON_RANGE_PER_LEVEL: 1.05
WEAPON_CRIT_CHANCE_PER_LEVEL: 1.10
WEAPON_CRIT_MULT_PER_LEVEL: 1.15

