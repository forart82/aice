# card-mpob7snv — additional buffer (world px) past ITEM_PICKUP_RADIUS
# applied by the `SpawnLevelXWeapon` console cheat so the freshly
# spawned floor item lands JUST outside the hero's auto-pickup ring.
# Tuned so a single eastward step still brings the item within reach.
