# Spec §Evasion Source L1397: "light weapons add baseline evasion". The
# weapon-side bonus joins the per-dice contributions in the
# `evasionPerSlots` aggregation that feeds EvasionHub::tryEvade. The spec
# names "Dagger or Knives" as the canonical light examples; we set
# Knives slightly higher than Dagger because spec L862 puts Knives at
# the longer-range / squishier end of the light cluster. Every other
# weapon type stays at 0.0 so a config edit (rather than a code edit)
# is the path to broaden the bonus to more types.
