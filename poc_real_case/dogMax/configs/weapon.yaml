# 10 weapon types: per-type base damage range, attacks-per-second, range,
# drop weight (Stage 2a). Numeric values pulled from GameDesign spec sections.
#
# T-BALANCE-range-coherence — base RANGE values are now archetype-canonical
# (every weapon inside one archetype shares the same base range so the
# Lv100 sqrt-scaled cap stays coherent within the archetype). Archetype
# basis is the per-weapon ATTACK_TYPE block further down (SA6). Mapping
# and chosen base:
#   Single       = ATTACK_TYPE SINGLE      -> 450 (Pitchfork keeps its
#                                            original tuned baseline; the
#                                            archetype is a singleton so
#                                            no averaging applies)
#   Multi        = SWIPE + MULTITARGET     -> 550 (avg of the prior tuned
#                                            values 450/450/450/600/600/600
#                                            = 525, rounded to the nearest
#                                            50-px step so swipers/Knives
#                                            share one base range)
#   AoE          = AOE                     -> 450 (avg of prior 300/300/600/
#                                            600 = 450 exactly — Mace/
#                                            Warhammer gain reach, Axes
#                                            tighten; AoE detonates at the
#                                            hero's feet so the archetype
#                                            now has uniform threat radius)
#   Charged      = MULTISINGLE             -> 300 (Dagger is the only
#                                            charged weapon; spec L1480-
#                                            1486 keeps the burst short-
#                                            range, base preserved)
# WEAPON_RANGE_LEVEL_POWER (0.2) is intentionally left untouched; the
# Lv100 cap stays at base * 100^0.2 ~= base * 2.51.

