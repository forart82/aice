# weapon_shapes_gallery.yaml — gallery-only weapon silhouettes for Ctrl+H.
#
# These shapes are display-only (not tied to WeaponType gameplay).  Built from
# the same polygon/star/lens/… forms as the enemy catalog so the existing
# buildEnemyShapeOutline geometry engine powers them.
#
# Tab "Cyber"  = indices 00..09  — plasma / nano-tech / energy aesthetic
# Tab "Void"   = indices 10..19  — void / dark magic / cosmic horror aesthetic
#
# Per-shape keys (NN = 00..19):
#   WG_NN_NAME          display label
#   WG_NN_FORM          polygon | star | cross | arrow | kite | shield |
#                       wedge | hourglass | drop | lens | gem
#   WG_NN_N             polygon side count / star point count
#   WG_NN_INNER         star inner-radius ratio / cross arm thickness (0..1)
#   WG_NN_ASPECT        bilateral vertical stretch (1 = none)
#   WG_NN_ROTATION_DEG  radial phase offset in degrees
#   WG_NN_CORE          accent core/eye radius fraction (0 = none)

