# Code-drawn neon world geometry (docs/DECISIONS.md 2026-08-08).
#
# The world layer carries no texture art any more. Ground reads as a near-black
# fill and everything that needs to be seen is a neon stroke, drawn in the same
# language as the hero and enemy bodies: a bright core line wrapped in stacked
# translucent glow layers whose alpha falls off as base / (layer + 1). That is
# deliberately the same falloff curve as THEME_HALO_GLOW_ALPHA_BASE so the world
# and the actors look like one system rather than two.
#
# WORLD IS SUBORDINATE. Actors must always win the eye — a zone boundary is
# navigation information, not a character. SUBORDINATE_SCALE multiplies every
# world-neon alpha so the whole world layer can be pushed behind the actors with
# one number, without re-tuning each element.

# The ground itself. With no ground texture anywhere, this single colour is the
# entire backdrop every neon stroke is read against — so it is the most
# load-bearing colour in the game, and it used to be a hard-coded black in
# WorldRenderer. Not pure black: a faint cool bias reads as a surface with depth
# rather than as a hole, and it gives the darkest neon glow bands something to
# sit against instead of vanishing.
WORLD_NEON_GROUND_R: 6
WORLD_NEON_GROUND_G: 8
WORLD_NEON_GROUND_B: 13

WORLD_NEON_ZONE_EDGE_ENABLE: 1

# Zone boundary colour. The world/prop slot of the locked three-hue palette:
# cyan at ~189 deg, clear of hero orange (22 deg) and enemy magenta (338 deg),
# so a zone edge can never be mistaken for an actor.
WORLD_NEON_ZONE_EDGE_R: 50
WORLD_NEON_ZONE_EDGE_G: 225
WORLD_NEON_ZONE_EDGE_B: 255

# Core stroke half-width in world pixels, before glow layers are added.
WORLD_NEON_ZONE_EDGE_THICKNESS: 3.0

# Glow stack. LAYERS is how many translucent bands wrap the core stroke, STEP is
# how much wider each successive band is (world pixels), ALPHA_BASE is the
# numerator of the base / (layer + 1) falloff.
#
# Deliberately NOT the actor halos' 55. The halo stacks five filled discs over a
# small radius, so its bands overlap heavily and 55 accumulates into a dense
# pool. A zone edge is a thin ribbon with almost no self-overlap, so the same
# number rendered as a bare wireframe line — the outer band landed near alpha 5.
# Same falloff curve, higher numerator, because the geometry it wraps is thinner.
WORLD_NEON_ZONE_GLOW_LAYERS: 6
WORLD_NEON_ZONE_GLOW_STEP: 7.0
WORLD_NEON_ZONE_GLOW_ALPHA_BASE: 150

# Alpha multiplier applied to every world-neon element. Below 1 so the world
# sits behind the actors; this is the single knob that enforces "props glow, but
# dimmer than actors" from the visual identity protocol Step 4.
WORLD_NEON_SUBORDINATE_SCALE: 0.6

# ---------------------------------------------------------------------------
# Code-drawn neon props
# ---------------------------------------------------------------------------
# A prop is a silhouette from the shared shape catalog (configs/enemy_shapes*.yaml)
# drawn with a dark fill, an inward neon rim and the world glow stack — the exact
# construction EnemyBodyPainter uses for enemy bodies, so props are visibly the
# same species of object as the actors without being mistaken for one.
#
# Props are placed with the existing WorldEditor stamp tool. A stamp catalog
# entry becomes a neon prop instead of a sprite by putting `shape:<index>` in its
# texture-path slot; see WORLD_ENVIRONMENT_STAMP_CATALOG in world_editor.yaml.
#
# Rim colour is a deeper teal than the zone-boundary cyan above. Both sit in the
# palette's single world hue, but a prop is an object and a zone edge is a line
# on the floor — keeping them a shade apart stops a cluster of props reading as
# a boundary.
WORLD_NEON_PROP_R: 30
WORLD_NEON_PROP_G: 190
WORLD_NEON_PROP_B: 225

# Body fill. Near-black with a faint cool bias so a prop reads as a solid object
# occluding the ground rather than an outline floating on it.
WORLD_NEON_PROP_FILL_R: 8
WORLD_NEON_PROP_FILL_G: 14
WORLD_NEON_PROP_FILL_B: 20

# Inward rim thickness, as a FRACTION of the prop's radius. Drawn inward
# (negative SFML thickness) to match both existing actor draw sites, so the
# silhouette stays exactly the authored shape instead of growing by the stroke.
# Proportional rather than absolute because props span a wide size range: a
# fixed 3 px rim is bold on a small marker and a hairline on a large monolith.
WORLD_NEON_PROP_RIM_RATIO: 0.05

# How far the glow reaches past the silhouette, as a fraction of prop radius.
# The glow is drawn as scaled-up copies of the prop's own shape rather than as
# circles, so a strongly-shaped prop glows along its outline instead of sitting
# inside a flat disc. Layer count and alpha falloff still come from the shared
# THEME_HALO_* keys, so the curve matches the actors.
WORLD_NEON_PROP_GLOW_SPREAD_RATIO: 0.3

# ---------------------------------------------------------------------------
# Ground grid (visual_identity.md Step 1, re-scoped for the code-drawn world)
# ---------------------------------------------------------------------------
# Step 1 was originally "crush the photoreal ground so it stops competing". With
# no ground texture left there is nothing to crush, and the problem inverted: a
# flat fill gives the eye nothing to hold, so actors read as floating in a void
# and there is NO MOTION CUE — a player sprinting across empty black cannot tell
# they are moving. That is a readability failure, not a polish one.
#
# The grid is anchored to world coordinates, so it slides past as the hero moves
# and restores the sense of speed the flat fill destroyed.
WORLD_NEON_GRID_ENABLE: 1

# Cell size in world pixels. Sized against the hero's 150 px body: roughly three
# bodies per cell, so the grid reads as architecture the hero moves through
# rather than as graph paper the hero sits on.
WORLD_NEON_GRID_SPACING: 480

# A heavier line every Nth cell, giving a coarser rhythm so the eye can judge
# DISTANCE and not merely motion. Must be > 1: at 1 every line is major and the
# two weights collapse into one.
WORLD_NEON_GRID_MAJOR_EVERY: 4

# Line alphas BEFORE the subordinate scale. Deliberately tiny — the grid has to
# be felt more than seen. If you can read the grid rather than the enemies, it
# is too strong and it has stopped doing its job.
WORLD_NEON_GRID_MINOR_ALPHA: 24
WORLD_NEON_GRID_MAJOR_ALPHA: 52

# Grid hue: the world's cyan, one shade cooler and far dimmer than a zone edge,
# so the floor never competes with a boundary that carries real information.
WORLD_NEON_GRID_R: 40
WORLD_NEON_GRID_G: 150
WORLD_NEON_GRID_B: 190
