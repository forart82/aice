# Dron pattern-detection thresholds.
#
# These tune HOW a roll is classified into a tier — they are structural,
# NOT the per-tier damage multipliers (those live in dron.yaml). Kept in
# their own file and read by DronDetector's ctor so d6-vs-d100 tier
# balance can be retuned without touching (or rebuilding) source.

# Hemidron "all-high / all-low" split, face-count-RELATIVE.
# A slotted die counts as HIGH when its rolled value is strictly greater
# than faceCount * SPLIT_RATIO, and LOW when it is at or below that
# midpoint. Making the midpoint relative (instead of a fixed >3) means a
# d6 keeps its classic >3 / <=3 split (midpoint 3) while a d100's midpoint
# becomes 50 (>50 required). That drops P(all-high) for six d100 from the
# ~83% freebie a fixed d6 threshold handed every d100 roll down to ~1.6%,
# so Hemidron is a real achievement and the tiers above it are reachable.
DRON_HEMIDRON_SPLIT_RATIO: 0.5

# Lineadron (x10): a run of this many consecutive distinct faces.
DRON_LINEADRON_STRAIGHT_LENGTH: 5

# Minidron (x3): a shorter run of consecutive distinct faces.
DRON_MINIDRON_STRAIGHT_LENGTH: 4

# Omidron (x20): one die on every face across this inclusive span — the
# canonical d6 "rainbow" 1..6. MIN..MAX defines both the required span and
# the exact distinct-face count (MAX - MIN + 1), so both are config-driven.
DRON_OMIDRON_MIN_FACE: 1
DRON_OMIDRON_MAX_FACE: 6
