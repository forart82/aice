# Unarmed enemy charge attack. An enemy with no weapons winds up (freezing,
# charge bar filling — the telegraph), then dashes into the hero; the shared
# Dashable arc deals collision damage using the existing dash contact tunables
# (dashContactRadius / dashContactDamageFrac in dodge.yaml), so damage stays
# consistent with the jump/dash contact rule.
ENEMY_UNARMED_CHARGE_ATTACK_NAME: Dash Attack

# Hero must be within this distance (world units) for the enemy to commit to
# a wind-up. Keep it at or below the dash's reach so the lunge connects.
ENEMY_CHARGE_TRIGGER_RANGE: 220

# Wind-up (telegraph) duration in seconds before the lunge fires.
ENEMY_CHARGE_WINDUP_SECONDS: 0.6

# Lunge speed (world units / second) and duration (seconds). Speed * duration
# is the reach; keep reach >= trigger range so the charge closes the gap.
ENEMY_CHARGE_DASH_SPEED: 900
ENEMY_CHARGE_DASH_SECONDS: 0.3

# Cooldown after a lunge before the enemy can wind up again.
ENEMY_CHARGE_RECOVER_SECONDS: 1.0
