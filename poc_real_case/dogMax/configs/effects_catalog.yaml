# Both catalog windows render EMBEDDED in the gallery's content area, which
# supplies the panel rect every frame — so there are no standalone panel
# position/size or modal-scrim keys here. The retired EFX_CATALOG_PANEL_X/Y/W/H
# and EFX_CATALOG_SCRIM_R/G/B/A fed a full-screen standalone window that no
# longer exists; nothing read them.
EFX_CATALOG_PADDING: 16
EFX_CATALOG_GRID_COLS: 5
EFX_CATALOG_CELL_W: 190
EFX_CATALOG_CELL_H: 190
EFX_CATALOG_CELL_GAP: 10
EFX_CATALOG_PREVIEW_SIZE: 130
EFX_CATALOG_TAB_H: 38
EFX_CATALOG_SCROLLBAR_W: 8
EFX_CATALOG_SCROLL_STEP: 40
EFX_CATALOG_BG_R: 8
EFX_CATALOG_BG_G: 8
EFX_CATALOG_BG_B: 18
EFX_CATALOG_BG_A: 245
# All catalog chrome colours collapse onto the single shared UI accent
# (theme.yaml UI_ACCENT_*) plus the shared panel-bg / text swatches, composed
# via ui::UiPanel/UiTab/UiCell + UiAccent + ColorTheme so both catalog windows
# track the same theme as every other window. The old private colour keys
# (EFX_CATALOG_BORDER_*/BORDER_THICKNESS/ACCENT_*, TAB_ACTIVE_*/TAB_INACTIVE_*,
# CELL_BG_*, LABEL_R/G/B, SCROLLBAR_R/G/B/A) and the horizontal
# EFX_CATALOG_TAB_GAP were retired as those fills/strokes moved to the tokens.
EFX_CATALOG_LABEL_FONT_SIZE: 13
EFX_CATALOG_TITLE_FONT_SIZE: 16
