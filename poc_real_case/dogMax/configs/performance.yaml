# Performance and profiling harness settings.

# `--perf-enemies=N` preloads N enemies into this visible ellipse around the
# hero before the self-test loop starts.
PERF_SWARM_RADIUS_X: 1800
PERF_SWARM_RADIUS_Y: 950
PERF_SWARM_MIN_RADIUS_FRAC: 0.08
PERF_SWARM_ENEMY_LEVEL: 1
PERF_SWARM_HERO_MAX_HEALTH: 1000000000
PERF_SWARM_HERO_INVULNERABLE_SECONDS: 3600

# Above these visible enemy counts, world-space enemy overlays shed detail.
# Healthbar/equipment chrome and text are not readable in swarm-scale views.
ENEMY_OVERLAY_CHROME_MAX_VISIBLE: 120
ENEMY_OVERLAY_TEXT_MAX_VISIBLE: 60

# Above this visible enemy count, batch simplified bodies/halos in one draw path.
ENEMY_BODY_LOD_MIN_VISIBLE: 600
ENEMY_BODY_LOD_CIRCLE_SIDES: 5
ENEMY_BODY_LOD_HALO_LAYERS: 0

# CPU framebuffer bloom is too expensive and visually unreadable at swarm density.
BLOOM_MAX_ENEMIES: 599
