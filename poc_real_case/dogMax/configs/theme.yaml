# Floor-item tier visuals (spec §Loot L1985 + §Quality §Aura L1744,L1751).
# `LOOT_AURA_RADIUS_MULT_*` scales the per-layer halo growth around a
# dropped weapon / dice sprite; `LOOT_AURA_ALPHA_MULT_*` scales the
# per-layer halo opacity. Common keeps the baseline; Uncommon adds a
# soft translucent aura; Rare reads larger and brighter so a pickup of
# value is instantly identifiable at a glance. Mirrors the
# ENEMY_AURA_*_MULT_* pattern in enemy.yaml — separate keys so the
# floor-item aesthetic can be tuned independently of enemy bodies.
LOOT_AURA_RADIUS_MULT_COMMON: 1.0
LOOT_AURA_RADIUS_MULT_UNCOMMON: 1.4
LOOT_AURA_RADIUS_MULT_RARE: 2.0
LOOT_AURA_ALPHA_MULT_COMMON: 1.0
LOOT_AURA_ALPHA_MULT_UNCOMMON: 1.5
LOOT_AURA_ALPHA_MULT_RARE: 2.2


# GPU bloom post-process between the physical-pixel world surface and the UI.
# A bright pass extracts neon pixels, then horizontal and vertical blur run at
# the configured downsample factor before additive composition.
#
# THRESHOLD is the pixel's STRONGEST CHANNEL (HSV value) in 0-255 units, not
# Rec.601 luminance — see assets/shaders/bloom_bright.frag for why a green-
# weighted luminance metric is wrong for a saturated-neon palette.
#
# 180 is chosen against the live swatches so the split is structural: hero
# orange (max 255), enemy magenta (200) and Rare pink (255) all clear it and
# bloom, while world neon — multiplied by WORLD_NEON_SUBORDINATE_SCALE down to
# ~153 — falls under it and does not. Actors bleed light, the world stays flat
# behind them, without either side needing a second set of tuning knobs.
BLOOM_RADIUS: 4
BLOOM_DOWNSAMPLE: 4
BLOOM_INTENSITY: 0.85
BLOOM_BRIGHT_THRESHOLD: 180
BLOOM_ENABLE: 1

# Neon-glow toggle for framed UI panels. When 1, framed panels (inventory,
# tooltip, debug) draw their outline through the in-shader outer-glow path
# (assets/shaders/panel.frag, u_color = UI_ACCENT). When 0, panels use the
# flat ui::UiPanel accent outline (crisp, no glow).
#
# DEFAULT 0: panel.frag draws a CHAMFERED frame whose visible edge is inset
# from the panel rect (plus an outer halo that bleeds past it), while all
# panel CONTENT (title/count chips, slot grid, list rows) is laid out to the
# flat rect edge — so the glow frame and the content don't line up. The flat
# ui::UiPanel border sits exactly on the rect edge, matching the content, so
# it stays aligned. Re-enabling glow needs a panel shader that draws its
# border ON the rect edge (no chamfer inset) to keep frame + content aligned.
# Independent of BLOOM_ENABLE (which is world-space bloom, not UI).
UI_GLOW_ENABLE: 1
# Aligned glow (ui::drawGlowFrame): a crisp accent border ON the panel rect
# edge (so it lines up with the panel content) plus an OUTWARD additive halo.
# Replaces the old chamfered panel.frag shader, which misaligned frame vs
# content and only lit part of the wide info bar. Tunables: how far the halo
# reaches past the edge (px), how many bands (smoothness), the inner band's
# alpha before additive accumulation.
UI_GLOW_SPREAD: 10
UI_GLOW_LAYERS: 5
UI_GLOW_ALPHA: 70


# SA13 per-quality Outline Intensity multiplier (spec §Outline
# Intensity L298-303 + §Tier Multiplier Reference L1772). Common
# baseline, Uncommon 1.4×, Rare 2.0×. Charged state adds +0.5 on top
# of the tier value (Rare-charged = 2.5×). The mult scales the
# rendered outline thickness so the bright-pass + bloom picks the
# neon stroke up more strongly on higher-tier entities.
OUTLINE_INTENSITY_MULT_COMMON: 1.0
OUTLINE_INTENSITY_MULT_UNCOMMON: 1.4
OUTLINE_INTENSITY_MULT_RARE: 2.0
OUTLINE_INTENSITY_CHARGED_BONUS: 0.5

