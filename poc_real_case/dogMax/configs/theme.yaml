FILIGREE_LINE_COUNT_RARE: 5
FILIGREE_RADIUS_MIN: 10
FILIGREE_RADIUS_MAX: 18
FILIGREE_LINE_LENGTH: 6
FILIGREE_LINE_THICKNESS: 1
FILIGREE_ALPHA: 140
