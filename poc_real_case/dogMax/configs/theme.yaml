# Aesthetic palette. Dark cyberpunk + neon outlines.
#
# ============================================================================
# CANONICAL COLOUR PALETTE INDEX (card T-P3-colour-palette-canonical, 2026-05-27)
# ============================================================================
# This block is the single point of reference for every colour swatch in the
# game. The actual RGB(A) triplets still live in their original *.yaml files
# next to the rest of the domain tunables; this index records WHERE each
# swatch is defined so a future palette swap is a one-file lookup, not a
# repo-wide grep. Once a consumer is lifted onto a `THEME_*` key the entry
# below should be updated to point at theme.yaml — until then the swatch
# is consumed directly from the file listed.
#
# 145 distinct colour-key bases across 17 *.yaml files (372 R/G/B/A lines).
#
# --- Domain 1: Quality Tier (canonical tier colours) -------------------------
#   QUALITY_TIER_COMMON_R/G/B           -> quality.yaml       (180,180,200)
#   QUALITY_TIER_UNCOMMON_R/G/B         -> quality.yaml       (80,200,255)
#   QUALITY_TIER_RARE_R/G/B             -> quality.yaml       (255,215,50)
#   ENEMY_AURA_{RADIUS,ALPHA}_MULT_*    -> enemy.yaml         (per-tier mult)
#   LOOT_AURA_{RADIUS,ALPHA}_MULT_*     -> theme.yaml         (per-tier mult)
#   OUTLINE_INTENSITY_MULT_*            -> theme.yaml         (per-tier mult)
#   FILIGREE_LINE_COUNT_*               -> theme.yaml         (per-tier count)
#   INVENTORY_SLOT_TIER_TINT_ALPHA      -> inventory.yaml     (tier-tint α)
#   INVENTORY_SLOT_TIER_OUTLINE_ALPHA   -> inventory.yaml     (tier-outline α)
#   WEAPON_SLOT_COUNT_QUALITY_ALPHA     -> loot.yaml          (slot-count α)
#
# --- Domain 2: UI Panel / Accent / Healthbar ---------------------------------
#   UI_ACCENT_R/G/B + ALPHA_*           -> theme.yaml         (canonical)
#   THEME_UI_TEXT_R/G/B                 -> theme.yaml         (canonical)
#   THEME_UI_DIM_R/G/B                  -> theme.yaml         (canonical)
#   THEME_HP_BAR_BG_R/G/B               -> theme.yaml         (canonical)
#   HP_RAMP_{GREEN,YELLOW,RED}_R/G/B    -> theme.yaml         (canonical)
#   WINDOW_BG_R/G/B                     -> window.yaml        (root canvas)
#   THEME_PANEL_BG_*                    -> theme.yaml         (canonical panel fill, G3b)
#   HELP_OVERLAY_BG                     -> theme.yaml         (folded → THEME_PANEL_BG)
#   HELP_OVERLAY_OUTLINE/HEADING        -> window.yaml        (F1 overlay accent)
#   INVENTORY_PANEL_BG_*                -> theme.yaml         (folded → THEME_PANEL_BG)
#   INVENTORY_SLOT_BG / SLOT_OUTLINE    -> inventory.yaml
#   INVENTORY_SORT_BUTTON_BG_*          -> inventory.yaml
#   INVENTORY_DESTROY_FLASH_R/G/B       -> inventory.yaml
#   TOOLTIP_BG_*                        -> theme.yaml         (folded → THEME_PANEL_BG)
#   TOOLTIP_HEADER_RULE / BORDER        -> tooltip.yaml
#   LOOT_FILTER_POPUP_BG_*              -> theme.yaml         (folded → THEME_PANEL_BG)
#   WEAPONSLOT_ROW_BG_*                 -> weaponslot.yaml    (override of THEME_PANEL_BG)
#   WEAPONSLOT_EMPTY_DICE_CELL_R/G/B    -> weaponslot.yaml
#   WEAPONSLOT_CHARGED_OUTLINE_R/G/B    -> weaponslot.yaml
#   XP_BAR_BG / XP_BAR_FILL / XP_BAR_TEXT -> xp.yaml
#
# --- Domain 3: Damage Text tiers --------------------------------------------
#   DAMAGE_TEXT_COLOR_R/G/B (Normal)    -> combat.yaml        (240,240,240)
#   DAMAGE_TEXT_HEAVY_COLOR_R/G/B       -> combat.yaml        (255,180,60)
#   DAMAGE_TEXT_CRIT_COLOR_R/G/B        -> combat.yaml        (255,60,60)
#
# --- Domain 4: Dron Float tint + Per-tier dice colours -----------------------
#   DRON_FLOAT_COLOR_R/G/B              -> dron.yaml          (255,215,80)
#   DRON_TIER_*_COLOR_R/G/B (×14 tiers) -> dron.yaml
#   DICE_COLOR_D{4,6,8,12,20,24,30,42,60,100}_R/G/B -> dice.yaml
#   NOTE: DRON_FLOAT_COLOR == DRON_TIER_HEXADRON == DRON_TIER_VOIDRON
#         (all 255,215,80) — value duplicate flagged, NOT changed.
#
# --- Domain 5: Debug Console / Panel / World Overlay -------------------------
#   DEBUG_PANEL_BG_*                    -> debug.yaml         (override of THEME_PANEL_BG)
#   CONSOLE_OUTPUT_BG_*                 -> debug.yaml         (override of THEME_PANEL_BG)
#   EFX_CATALOG_BG_*                    -> effects_catalog.yaml (override of THEME_PANEL_BG)
#   DEBUG_PANEL_TAB_{BG,ACTIVE,LABEL}_* -> debug.yaml
#   DEBUG_PANEL_MIN_BUTTON_BG/LABEL_*   -> debug.yaml
#   CONSOLE_INPUT_TEXT_*                -> debug.yaml
#     (input-bg + caret collapsed to panel-bg / UI accent — keys removed)
#   CONSOLE_OUTPUT_BG/TEXT_*            -> debug.yaml
#   CONSOLE_ERROR_TEXT / SUCCESS_TEXT_* -> debug.yaml
#   CONSOLE_DROPDOWN_TEXT_*             -> debug.yaml
#     (dropdown-bg + row highlight collapsed to panel-bg / dim UI accent — keys removed)
#   NOTE: Debug-world overlay swatches (hero/enemy rings, level zones,
#         spawn ring, pathfinding) are currently hard-coded in
#         render::drawDebugWorldOverlays — flagged for future lift, not
#         present as keys yet.
#
# --- Domain 6: Powder swatches (×12 colours) ---------------------------------
#   POWDER_COLOR_{RED,YELLOW,CYAN,GREEN,BLUE,MAGENTA,PURPLE,
#                 ORANGE,PINK,WHITE,BLACK}_R/G/B -> inventory.yaml
#   (NB: powder lives in inventory.yaml historically; ideal lift target
#    is a dedicated `configs/powder.yaml` palette block — already started.)
#
# --- Domain 7: Floor-item tier -----------------------------------------------
#   (The world floor itself is gone — solid black background, no shader.)
#   LOOT_AURA_{RADIUS,ALPHA}_MULT_*     -> theme.yaml         (per-tier mult)
#
# --- Domain 8: Enemy / Hero body + death VFX --------------------------------
#   ENEMY_OUTLINE_R/G/B                 -> enemy.yaml         (200,40,100)
#   ENEMY_FILL_R/G/B                    -> enemy.yaml         (20,8,22)
#   ENEMY_DEATH_SHARD_START_ALPHA       -> enemy.yaml
#   ENEMY_DEATH_BODY_FRAGMENT_START_ALPHA -> enemy.yaml
#   ENEMY_DEATH_RING_{INNER,MID,OUTER}_START_ALPHA -> enemy.yaml
#   HERO_OUTLINE_R/G/B                  -> hero.yaml          (255,120,40)
#   HERO_FILL_R/G/B                     -> hero.yaml          (18,14,18)
#   HERO_LEVEL_UP_RING_COLOR_R/G/B      -> hero.yaml          (255,240,120)
#   HERO_DEATH_FADE_TINT_R/G/B + PEAK_ALPHA -> hero.yaml
#   HERO_DEATH_PANEL_BG_*               -> hero.yaml
#   HERO_DEATH_PANEL_OUTLINE_R/G/B      -> hero.yaml
#
# --- Domain 9: Evasion / Dodge / Ghost Trail --------------------------------
#   GHOST_TRAIL_OUTLINE_R/G/B           -> evasion.yaml       (200,255,255)
#   GHOST_TRAIL_TRAIL_INITIAL_ALPHA     -> evasion.yaml
#   DODGE_DOT_{OUTLINE,FILL,EMPTY,REFILL}_R/G/B/A -> dodge.yaml
#
# --- Domain 10: XP Float -----------------------------------------------------
#   XP_FLOAT_COLOR_R/G/B                -> xp.yaml            (120,210,255)
#   XP_FLOAT_STREAK_COLOR_R/G/B         -> xp.yaml            (255,215,80)
#   NOTE: XP_FLOAT_STREAK == DRON_FLOAT (255,215,80) — flagged, NOT changed.
#
# --- Domain 11: Weapon archetype outlines + fills (×10 weapons) -------------
#   PITCHFORK / LONG_SWORD / GREAT_SWORD / HALBERD /
#   QUARTERSTAFF / KNIVES / DAGGER / MACE / WARHAMMER /
#   BIG_AXE / (and dice-tier baked into dice.yaml)
#                                       -> weapon.yaml        OUTLINE + FILL
#
# ----------------------------------------------------------------------------
# LIFT PLAN — recommended order of consumer-side migrations onto theme.yaml:
#   1. quality.yaml QUALITY_TIER_{COMMON,UNCOMMON,RARE}_R/G/B
#      → THEME_QUALITY_TIER_*_R/G/B  (highest leverage: tier swatch echoes
#      into Aura, Outline, Filigree, Damage Text, Healthbar trim, sidebar
#      ring, sort buttons — one canonical swatch unlocks them all).
#   2. combat.yaml DAMAGE_TEXT_{NORMAL,HEAVY,CRIT}_COLOR
#      → THEME_DAMAGE_TEXT_*  (so crit can echo QUALITY_TIER_RARE without
#      a parallel swatch).
#   3. inventory.yaml POWDER_COLOR_* (×12)
#      → migrate the powder block into the existing configs/powder.yaml
#      under THEME_POWDER_* aliases (powder.yaml already exists).
#   4. dron.yaml DRON_FLOAT_COLOR
#      → THEME_DRON_FLOAT_*  (and reconcile the HEXADRON/VOIDRON value
#      duplicate — pick one canonical, alias the other).
#   5. xp.yaml XP_BAR_{BG,FILL,TEXT} + XP_FLOAT_{COLOR,STREAK_COLOR}
#      → THEME_XP_*  (XP_FLOAT_STREAK already collides with DRON_FLOAT).
#   6. window.yaml WINDOW_BG + HELP_OVERLAY_*
#      → THEME_WINDOW_BG + THEME_HELP_OVERLAY_*.
#   7. [DONE — G3b] inventory + tooltip + loot_filter + window(help) panel
#      backgrounds folded onto THEME_PANEL_BG_* (below), read through
#      render::resolvePanelBackground. WeaponSlot/Debug/Console/Catalog
#      backgrounds routed through the same helper but keep an explicit
#      per-panel override (translucent/dev surfaces). Outlines left as-is
#      (deliberate per-panel accent identity; UI_ACCENT already covers the
#      rest) — folding them would change appearance.
#   8. hero.yaml + enemy.yaml outline/fill/death keys
#      → THEME_HERO_* / THEME_ENEMY_* (low priority: body-colour is
#      character identity, less likely to be palette-swapped).
#   9. weapon.yaml per-archetype OUTLINE + FILL (×13)
#      → THEME_WEAPON_<ARCHETYPE>_*  (lowest priority: per-archetype
#      identity colour, rarely worth bulk-swapping).
#  10. debug.yaml console/panel + ungeneralised debug-world overlay
#      keys → THEME_DEBUG_* (dev-only, lowest user-visible impact).
#
# Value-duplicates flagged (NOT corrected in this card):
#   - DRON_FLOAT_COLOR == DRON_TIER_HEXADRON_COLOR == DRON_TIER_VOIDRON_COLOR
#     == XP_FLOAT_STREAK_COLOR == (255,215,80). Same yellow used as four
#     parallel swatches. Consider QUALITY_TIER_RARE rebase (255,215,50) for
#     visual consistency or alias all four to one canonical "neon-gold".
# ============================================================================
#

THEME_HALO_OUTLINE_THICKNESS: 4
THEME_HALO_GLOW_LAYERS: 5
# Lowered 150 -> 55 (visual identity Step 3 swarm test). The halo is five
# stacked discs and the alpha is divided by (layer + 1), so 150 produced
# per-layer alphas of 75/50/37/30/25. Individually fine; overlapping across a
# pack they summed toward opaque and merged every enemy into one continuous
# mass, hiding the hero completely. 55 gives 27/18/13/11/9 — still a clear
# glow pool per body, but pools now read as translucent and overlap without
# blowing out. Drives the hero halo too, so hero and enemies stay in step.
THEME_HALO_GLOW_ALPHA_BASE: 55
THEME_HALO_GLOW_RADIUS_STEP: 5

# Spec §Render Order L337: view-rect cull padding (world pixels). Padded
# outward on all four edges so neon halos and death rings at the edge of
# the camera view do not pop in/out as the player moves. Worst-case Rare
# enemy halo is ~5 layers * radius_step * aura_mult, plus the death ring
# outer radius; keep this comfortably above that worst case.
THEME_VIEW_CULL_PADDING: 200

THEME_UI_TEXT_R: 210
THEME_UI_TEXT_G: 215
THEME_UI_TEXT_B: 235
THEME_UI_DIM_R: 110
THEME_UI_DIM_G: 120
THEME_UI_DIM_B: 140

# Canonical UI accent stroke (B-UX-11 single visual language). Pale
# teal-gold sits between cool surface backgrounds and warm tier-rare
# rings so it harmonises with every other UI swatch. Every framed UI
# surface (inventory, tooltip, debug panel, console, sidebar, fps
# label, healthbar trim) reads its outline + active-state colour
# through `render::UiAccent::loadFromConfig`; never define a parallel
# accent triple per surface.
#
# `ALPHA_FULL` is the high-emphasis stroke used on framed panels;
# `ALPHA_DIM` is the low-emphasis stroke used on tiled rows that
# would otherwise stack into a loud frame. `OUTLINE_THICKNESS` is the
# framed-panel border weight; `OUTLINE_THICKNESS_HAIRLINE` is the
# tooltip-rule / healthbar-trim weight.
# Dark-cyberpunk neon accent — deep electric blue (was bright cyan
# 80,230,255). One key group drives every chrome outline/active state
# across the whole UI. Floor for the glow shader (panel.frag multiplies
# u_color by its glow term): keep G >= ~110, B >= ~190 or the neon glow
# reads too dim on the near-black panel.
UI_ACCENT_R: 45
UI_ACCENT_G: 130
UI_ACCENT_B: 215
UI_ACCENT_ALPHA_FULL: 255
UI_ACCENT_ALPHA_DIM: 180
UI_ACCENT_OUTLINE_THICKNESS: 3.0
UI_ACCENT_OUTLINE_THICKNESS_HAIRLINE: 1.5

# LIFT PLAN step 7 (G3b) — CANONICAL FRAMED-PANEL BODY FILL. One swatch
# for every window background so a single edit restyles them all. The
# scattered per-panel backgrounds were folded onto this key; each window
# reads it through `render::resolvePanelBackground` (see ColorTheme.hpp).
# Editing THEME_PANEL_BG_* here — or a live console `set THEME_PANEL_BG_A=…`
# / editable-Config-tab commit — cascades to every non-overridden window.
#
# Folded onto this canonical swatch (no per-panel key any more, they
# cascade): Inventory panel, Loot-filter popup, Tooltip, Help overlay.
# Kept as explicit per-panel OVERRIDES because they genuinely differ and
# must stay pixel-exact (the override wins over this value when present):
#   - WEAPONSLOT_ROW_BG_*  (α170, deliberately translucent tiled rows)
#   - DEBUG_PANEL_BG_*     (α140, deliberately translucent dev overlay)
#   - CONSOLE_OUTPUT_BG_*  (α200, dev console; shared with the debug panel)
#   - EFX_CATALOG_BG_*     (α245, dev effects-catalog window)
# Deleting any of those override keys makes that window cascade too.
#
# Value = the common dark near-black panel look. Matches the loot-filter
# popup exactly; the other folded panels differed only by a few
# sub-perceptual units on a near-black surface and now share this swatch.
# Alpha is `_A` (not `_ALPHA`) to match the `set THEME_PANEL_BG_A=…` path.
# Outlines are now folded too: every framed panel reads the single
# UI_ACCENT stroke (the former per-panel INVENTORY_PANEL_BORDER teal /
# TOOLTIP_BORDER blue / LOOT_FILTER_ACCENT cyan hues were collapsed into
# the one accent for the single-color dark-cyberpunk chrome).
THEME_PANEL_BG_R: 10
THEME_PANEL_BG_G: 12
THEME_PANEL_BG_B: 18
THEME_PANEL_BG_A: 230

# card-mpl9hhw6 — PanelChrome shared chrome (`render/PanelChrome.cpp`).
# Every framed UI surface (sidebar, inventory, tooltip, help, debug
# panel, console, healthbar trim, XP bar) reads its corner bracket +
# title band geometry through these keys so the chrome reads as one
# set across the whole UI.
#
# `CORNER_BRACKET_LENGTH`     — leg length (px) of the L-shaped
#                                bracket painted at each corner of a
#                                framed panel.
# `CORNER_BRACKET_THICKNESS`  — bracket leg thickness (px). Sized so
#                                the bracket reads brighter than the
#                                accent outline without dominating.
# `TITLE_BAND_HEIGHT`         — pixel height of the optional title
#                                stripe across the top edge of a
#                                framed panel.
# `TITLE_BAND_FILL_*`         — title stripe fill colour + alpha
#                                (sits between the panel body fill
#                                and the accent outline).
# `TITLE_BAND_TEXT_*`         — title label colour (no alpha — fully
#                                opaque to read against the band).
# `TITLE_BAND_FONT_SIZE`      — title label font size.
# `TITLE_BAND_PADDING_X`      — horizontal padding inside the title
#                                band before the label baseline.
# `BODY_INSET`                — extra inset inside the accent outline
#                                before any panel content paints; the
#                                computed body rect uses this so the
#                                slot grid never kisses the frame.

