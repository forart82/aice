# A gallery image applied to a selected path becomes a smart path atlas when it
# is square and divisible into a 6x6 grid using the documented topology grammar.
# Painted port positions and headings command the resolved chain; player points
# remain intentions, so whole modules may end away from the requested position.
WORLD_EDITOR_DEFAULT_PATH_ATLAS_ASSET: assets/textures/world/ground/worn_farm_track_modules_6x6_hq_v2.png

