# Doge defense system.
# evade = min(EVASION_CAP, 1 − Π_i (1 − evasionPerSlotᵢ))
# Generalisation of the spec form `1 − (1 − evasionPerSlot)^slots` for
# heterogeneous dice — the product form falls back to the spec form when
# every dice carries the same evasionPerSlot value.

EVASION_CAP: 0.75
GHOST_TRAIL_FLASH_DURATION: 0.15

# Ghost-step outline colour during the flash window (white-cyan per spec).
GHOST_TRAIL_OUTLINE_R: 200
GHOST_TRAIL_OUTLINE_G: 255
GHOST_TRAIL_OUTLINE_B: 255

# Spec §Evasion Visual L1412 — trailing-sprite copy that fades out behind
# the hero on a successful evade. Duration mirrors the flash window
# but lives on its own key so a tuner can decouple the two channels
# without touching code.
GHOST_TRAIL_TRAIL_DURATION: 0.15
# Initial alpha (0..255) the ghost outline starts at. 180 reads as a
# clearly visible silhouette without overpowering the live hero.
GHOST_TRAIL_TRAIL_INITIAL_ALPHA: 180
