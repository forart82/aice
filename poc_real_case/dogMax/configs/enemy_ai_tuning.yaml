# Elite / Special enemy AI aggression scaling + flank approach geometry.
# Pure balance multipliers layered on top of the baseline jump/dash/juke
# tunables in enemy_mind.yaml and enemy_dash.yaml. Consumed by
# EnemyManager_Ai.cpp (offensive jump/dash/juke/flank) and
# EnemyManager_Dash.cpp (defensive on-hit sidestep) via loadAiTuning().

# Offensive jump + dash scaling — Special enemies (any SpecialEnemyKind).
# Chance multipliers are clamped to 1.0 in code; cooldown multipliers shorten
# the retry window so specials act more often.
ENEMY_AI_SPECIAL_JUMP_CHANCE_MULT: 1.8
ENEMY_AI_SPECIAL_JUMP_COOLDOWN_MULT: 0.6
ENEMY_AI_SPECIAL_DASH_CHANCE_MULT: 1.8
ENEMY_AI_SPECIAL_DASH_COOLDOWN_MULT: 0.5

# Offensive jump + dash scaling — Rare elites.
ENEMY_AI_RARE_JUMP_CHANCE_MULT: 1.5
ENEMY_AI_RARE_JUMP_COOLDOWN_MULT: 0.7
ENEMY_AI_RARE_DASH_CHANCE_MULT: 1.5
ENEMY_AI_RARE_DASH_COOLDOWN_MULT: 0.65

# Offensive jump + dash scaling — Uncommon elites.
ENEMY_AI_UNCOMMON_JUMP_CHANCE_MULT: 1.25
ENEMY_AI_UNCOMMON_JUMP_COOLDOWN_MULT: 0.85
ENEMY_AI_UNCOMMON_DASH_CHANCE_MULT: 1.2
ENEMY_AI_UNCOMMON_DASH_COOLDOWN_MULT: 0.8

# Roll-failure retry cooldowns (seconds). On a failed Bernoulli roll the enemy
# waits this short window before re-rolling, instead of the full ability cooldown.
ENEMY_AI_JUMP_RETRY_COOLDOWN: 0.5
ENEMY_AI_DASH_RETRY_COOLDOWN: 0.5

# Juke (chase-deflection) chance scaling by rank. Clamped to 1.0 in code.
ENEMY_AI_SPECIAL_JUKE_CHANCE_MULT: 2.0
ENEMY_AI_RARE_JUKE_CHANCE_MULT: 1.6
ENEMY_AI_UNCOMMON_JUKE_CHANCE_MULT: 1.3

# Flank approach geometry (world px + degrees). Flanking is active while the
# hero is inside MAX_DISTANCE and outside attack range; the angle blends from 0
# at MAX_DISTANCE up to full at MID_DISTANCE, then back to 0 at attack range.
# BLEND_DIVISOR is the width of the [MID, MAX] band used for the upper blend.
ENEMY_AI_FLANK_MAX_DISTANCE: 900.0
ENEMY_AI_FLANK_MID_DISTANCE: 500.0
ENEMY_AI_FLANK_BLEND_DIVISOR: 400.0
ENEMY_AI_FLANK_MAX_ANGLE_DEG: 30.0

# Defensive dash scaling (on-hit sidestep). Chance multipliers clamped to 1.0;
# cooldown multipliers shorten the evade window for tougher ranks.
ENEMY_AI_SPECIAL_DEF_DASH_CHANCE_MULT: 2.0
ENEMY_AI_SPECIAL_DEF_DASH_COOLDOWN_MULT: 0.5
ENEMY_AI_RARE_DEF_DASH_CHANCE_MULT: 1.8
ENEMY_AI_RARE_DEF_DASH_COOLDOWN_MULT: 0.6
ENEMY_AI_UNCOMMON_DEF_DASH_CHANCE_MULT: 1.4
ENEMY_AI_UNCOMMON_DEF_DASH_COOLDOWN_MULT: 0.8
