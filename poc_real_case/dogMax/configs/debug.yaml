# Spec §Debug Mode (L2791-2890) + §Console (L2891-2987).
# Tunables for the developer overlay + in-game console.
# Source files read these via ConfigLoader; never hard-code locally.

# --- Debug panel rect (fraction of window) ---
# Panel covers a centred rectangle. WidthFrac / HeightFrac in [0,1].
# Shrunk from the original 0.70 × 0.70 since the Console moved out of
# the panel and there's no longer a long scrollback to budget for.
# Widened 0.42 -> 0.54 so all 8 tab labels (incl. "Performance") fit their
# headers without truncating, and the body has room for the General
# dashboard. Height raised 0.55 -> 0.60 for the same reason.
DEBUG_PANEL_WIDTH_FRAC: 0.54
DEBUG_PANEL_HEIGHT_FRAC: 0.60

# --- Panel chrome ---
DEBUG_PANEL_BG_R: 14
DEBUG_PANEL_BG_G: 10
DEBUG_PANEL_BG_B: 24
DEBUG_PANEL_BG_ALPHA: 140

# Initial top-left position of the panel (UI design coords). The panel
# now anchors top-left by default and tracks a user-drag offset that
# the player adjusts by grabbing the drag handle at the leftmost
# square of the tab strip. Zero defaults pin the panel at the very
# top-left of the design canvas; raise these to bias the initial
# position away from the corner without re-introducing the old
# centred layout.
#
# OffsetY must clear the v2 chamfered-chip accent outline overhang at
# the top of the panel (chipHeight*0.5 ~10 px + accent thicknessOutline
# ~2 px). 16 px gives 4 px of headroom so the chip outline never paints
# above the design canvas's y=0 edge.
DEBUG_PANEL_INITIAL_OFFSET_X: 0
DEBUG_PANEL_INITIAL_OFFSET_Y: 16
# Panel border + thickness pull from theme.config UI_ACCENT_*
# (B-UX-11 single visual language). The Console overlay border also
# reads through `render::UiAccent::loadFromConfig`, so the debug
# panel and the console share the same stroke even when only one is
# visible at a time.

# Tab header strip across the top of the panel (spec L2865). Raised 24 -> 30
# so the tab chips are taller and the labels sit clear of the chip chamfer.
# Tab chrome colours (bg / active / hover / label) were collapsed into the
# single UI accent: inactive bg = THEME_PANEL_BG, active = UiAccent::dim(),
# hover = UiAccent::full(), labels = THEME_UI_TEXT / THEME_UI_DIM. Their
# per-tab DEBUG_PANEL_TAB_* swatches are gone (no reader remains).
DEBUG_PANEL_TAB_HEIGHT: 30
DEBUG_PANEL_TEXT_SIZE: 16

# Minimise / restore button square at the top-right of the tab strip.
# Square side = DEBUG_PANEL_TAB_HEIGHT so the chrome stays tidy. Its fill
# reads THEME_PANEL_BG and its glyph THEME_UI_TEXT through the accent
# collapse — the old DEBUG_PANEL_MIN_BUTTON_* swatches were removed.

# --- Console scrollback (card-mpkd92tu) ---
# Lines moved per PageUp / PageDown keystroke (large step so a single
# press uncovers a meaningful slice of history).
CONSOLE_SCROLL_PAGE_LINES: 10
# Lines moved per mouse-wheel notch while the console is focused.
# Small step so wheel scrolling feels natural; positive wheel delta
# walks toward older lines like every other terminal.
CONSOLE_SCROLL_WHEEL_LINES: 3

# --- Debug panel body scrollback (card-mpkwdbzn) ---
# Scroll the body of the active tab when the panel overflows (the
# Config tab routinely dumps hundreds of keys and used to clip them
# silently). Same shape as the console settings above: PageUp / PageDown
# walk in bigger steps; the wheel walks in a finer step; End jumps far
# enough to land at the last line on any sensible tab (the render-time
# clamp snaps back to maxOffset).
DEBUG_PANEL_SCROLL_PAGE_LINES: 10
DEBUG_PANEL_SCROLL_WHEEL_LINES: 3
DEBUG_PANEL_SCROLL_END_JUMP_LINES: 100000

# --- Generic UI list wheel step (px) ---
# Default pixel offset walked per mouse-wheel notch for plain UI lists
# that scroll by pixels rather than by lines (e.g. the Unified Gallery
# Fonts list). Kept separate from the line-count wheel steps above.
UI_SCROLL_STEP_DEFAULT: 36

# --- Debug-panel inline search field ---
# Shown on filterable tabs (Enemies / Weapons / Dices / Floor / Config).
# Height is the strip between the tab bar and the scrollable body.
# The field's colours collapsed into the UI accent: background =
# THEME_PANEL_BG, focused border = UiAccent::full(), normal border =
# UiAccent::dim(), text/placeholder/caret = THEME_UI_TEXT / THEME_UI_DIM.
# The old DEBUG_SEARCH_BAR_BG / _FOCUSED_BORDER / _DIM_BORDER / _CURSOR
# swatches were removed (no reader remains).
DEBUG_SEARCH_BAR_HEIGHT: 22

# --- Debug panel speed control strip (always-visible bottom bar) ---
# Height in px of the speed control strip docked at the bottom of the panel.
# Contains [−] and [+] buttons to step game speed in 0.2 increments (0 = frozen, 4 = 4×).
DEBUG_SPEED_STRIP_HEIGHT: 28
# [−] / [+] button behaviour: each press steps gameTimeScale by STEP, snapped
# to 1/ROUNDING granularity (ROUNDING=10 → 0.1 steps of precision), and clamped
# to [MIN, MAX]. Defaults reproduce the previous 0.2 step in [0, 4].
GAME_TIME_SCALE_STEP: 0.2
GAME_TIME_SCALE_ROUNDING: 10.0
GAME_TIME_SCALE_MIN: 0.0
GAME_TIME_SCALE_MAX: 4.0

# --- Enemies-tab click-to-expand drawer (card-mpmzs1j5) ---
# Animation duration in seconds for the reveal-from-the-top of the
# per-enemy detail drawer when the user clicks a row in the Enemies
# tab. The renderer paints `floor(seconds / duration) * drawerLines`
# detail lines so the drawer grows from zero lines to its full body
# over `duration` seconds, then stays open until a second click
# closes it (toggle).
DEBUG_PANEL_ROW_EXPAND_ANIM_SECONDS: 0.20

# --- Console overlay (spec §Console L2891-2987) ---
# Console renders as a translucent strip pinned to the top of the
# screen, independent of the debug panel. Width is a centred fraction
# of the window; height is a fraction of the window so the strip
# scales with the canvas.
# Compacted: the scrollback is bottom-anchored, so the old 0.40 height left a
# large empty band above the few visible lines. 0.72 x 0.30 keeps a tidy strip
# with ~8-10 lines of history visible while removing the dead space.
CONSOLE_OVERLAY_WIDTH_FRAC: 0.72
CONSOLE_OVERLAY_HEIGHT_FRAC: 0.30

# Monospace text, single-line input + scrolling output. The input strip fill
# folds onto the shared panel background (CONSOLE_OUTPUT_BG override → THEME_PANEL_BG)
# and the caret reads the canonical UI accent (theme.yaml), so no distinct input-bg
# or caret hue lives here after the single-accent chrome collapse (Phase B).
CONSOLE_INPUT_HEIGHT: 28
CONSOLE_INPUT_TEXT_R: 230
CONSOLE_INPUT_TEXT_G: 230
CONSOLE_INPUT_TEXT_B: 250

CONSOLE_OUTPUT_BG_R: 10
CONSOLE_OUTPUT_BG_G: 6
CONSOLE_OUTPUT_BG_B: 22
CONSOLE_OUTPUT_BG_ALPHA: 200
CONSOLE_OUTPUT_TEXT_R: 210
CONSOLE_OUTPUT_TEXT_G: 210
CONSOLE_OUTPUT_TEXT_B: 230
CONSOLE_ERROR_TEXT_R: 240
CONSOLE_ERROR_TEXT_G: 90
CONSOLE_ERROR_TEXT_B: 90
CONSOLE_SUCCESS_TEXT_R: 120
CONSOLE_SUCCESS_TEXT_G: 220
CONSOLE_SUCCESS_TEXT_B: 120

# Typing-time autocomplete dropdown rendered below the input line.
# Row height controls both layout + the cap on dropdown height (8 rows
# is the suggestion cap baked into Console::kDefaultSuggestionLimit).
CONSOLE_DROPDOWN_ROW_HEIGHT: 20
# The dropdown container folds onto the shared panel background
# (CONSOLE_OUTPUT_BG override → THEME_PANEL_BG) and the selected-row highlight
# reads the dim UI accent (theme.yaml) after the single-accent chrome collapse
# (Phase B); only the neutral row text remains a console-local swatch.
CONSOLE_DROPDOWN_TEXT_R: 220
CONSOLE_DROPDOWN_TEXT_G: 220
CONSOLE_DROPDOWN_TEXT_B: 240

# Storage caps (spec L2962-2967).
CONSOLE_OUTPUT_LINES_MAX: 200
# T-CONSOLE-history-filter — every command typed since the game started
# (capped at this size, in-memory only — does NOT persist across game
# restart). Up/Down walks this list filtered by the current input as a
# case-insensitive substring needle. 200 entries is enough to cover a
# multi-hour dev session without bloating the in-memory buffer.
CONSOLE_HISTORY_CAP: 200
# Maximum number of rows surfaced in the typing-time autocomplete
# dropdown (spec §Autocomplete L2970-2976). Eight rows fits the
# CONSOLE_DROPDOWN_ROW_HEIGHT * 8 = 160 px slab below the input.
CONSOLE_SUGGESTION_LIMIT: 8

# Echo / output line prefixes (spec L2969-2975 — "small chevron prefix").
# Echoed input lines start with INPUT_PREFIX; plain output starts with OUTPUT_PREFIX.
CONSOLE_INPUT_PREFIX: >
CONSOLE_OUTPUT_PREFIX: ":"

# Ctrl+E Enemy Design Editor — live preview square side length (UI design px).
ENEMY_EDITOR_PREVIEW_SIZE: 240

# --- Performance tab FPS history graph (spec L2848) — UiBarChart bars ---
# Number of recent frame times kept for the FPS graph / rolling average.
FPS_HISTORY_BUFFER_LENGTH: 120

# Per-sample bar colour switches at this FPS threshold: >= good, < bad.
# 60 matches the target frame rate already used for the graph's scaleMax floor.
DEBUG_PERF_GRAPH_GOOD_FPS_THRESHOLD: 60
DEBUG_PERF_GRAPH_GOOD_R: 120
DEBUG_PERF_GRAPH_GOOD_G: 220
DEBUG_PERF_GRAPH_GOOD_B: 120
DEBUG_PERF_GRAPH_BAD_R: 220
DEBUG_PERF_GRAPH_BAD_G: 160
DEBUG_PERF_GRAPH_BAD_B: 80
