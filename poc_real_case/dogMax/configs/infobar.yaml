# Bottom info bar — the always-on player cockpit HUD strip along the bottom
# edge. The generated bitmap frame carries the art direction; live widgets sit
# inside it as neon bays, ports, and rails.
# Geometry is in UI design-space units (1920x1080). All chrome reads the single
# UI_ACCENT; gameplay colors (HP ramp, dice/dron tiers, charged gold) stay in
# their own configs.

# Band placement: full design width minus a side margin each side, pinned to
# the bottom edge with a small bottom margin.
INFOBAR_HEIGHT: 150
INFOBAR_BOTTOM_MARGIN: 10
INFOBAR_SIDE_MARGIN: 16

# XP is a full-width top rail. The remaining cockpit body starts with the
# health tank/core as the physical left anchor, then weapon slots and utility
# readouts continue to the right (fractions must sum to ~1.0).
INFOBAR_XP_STRIP_HEIGHT: 18
INFOBAR_XP_STRIP_GAP: 8
INFOBAR_FRACTION_HEALTH: 0.20
INFOBAR_FRACTION_WEAPONS: 0.58
INFOBAR_FRACTION_LUCK: 0.07
INFOBAR_FRACTION_POWDER: 0.07
INFOBAR_FRACTION_DASH: 0.08
INFOBAR_FRACTION_ACTIONS: 0.00

# Padding inside the bar frame and between sub-sections / weapon-slot tiles.
INFOBAR_CONTENT_PAD: 8
INFOBAR_SLOT_PAD: 6

# Per-slot weapon tile: physical slots lay out horizontally across the weapons
# sub-section, but only rows unlocked by configs/weaponslot.yaml are drawn.
# Each tile stacks vertically (weapon icon on top, dice grid in the middle,
# charge/dron readout at the bottom). The dice cells lay out in a grid so 6 dice
# read clearly in a narrow cockpit bay rather than a cramped single row.
INFOBAR_SLOT_WEAPON_ZONE_FRACTION: 0.42
INFOBAR_SLOT_DICE_ZONE_FRACTION: 0.45
INFOBAR_SLOT_PROGRESS_ZONE_FRACTION: 0.13
INFOBAR_DICE_GRID_COLS: 3

# Readout typography.
