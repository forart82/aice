# Hero-specific silhouettes (visual_identity.md Step 2b).
#
# The shared catalog's 60 shapes were authored as ENEMY bodies — compact and
# broadly radial, because an enemy is a threat blob read at a glance in a crowd.
# The hero is looked at 100% of the time and has to answer a question no enemy
# does: which way am I pointing. These three are authored for that instead, and
# live in their own file so the enemy alphabet stays untouched.
#
# All three are elongated along the facing axis, because length is what makes
# rotation legible: a compact shape can spin without the eye registering it.
#
# They extend the same SHAPE_NN_* series the enemy catalog uses, so they load
# through the existing loader with no code change. ENEMY_SHAPE_COUNT in
# enemy_shapes.yaml is raised to cover them.

# A dart: kite stretched along its axis, with a bright core at the centre of
# mass. The core doubles as the eye's anchor point in a crowded fight.
SHAPE_60_NAME: HeroDart
SHAPE_60_FORM: kite
SHAPE_60_N: 4
SHAPE_60_INNER: 0.0
SHAPE_60_ASPECT: 1.5
SHAPE_60_ROTATION_DEG: 0
SHAPE_60_CORE: 0.16

# A delta: clean chevron with a concave tail, so the rear reads as distinct from
# the nose even in silhouette. No core — this one bets on pure outline.
SHAPE_61_NAME: HeroDelta
SHAPE_61_FORM: arrow
SHAPE_61_N: 3
SHAPE_61_INNER: 0.0
SHAPE_61_ASPECT: 1.3
SHAPE_61_ROTATION_DEG: 0
SHAPE_61_CORE: 0.0

# A lance: the sharpest of the three, a long forward wedge. Most aggressive
# read, and the most legible rotation, at the cost of looking least like a body.
SHAPE_62_NAME: HeroLance
SHAPE_62_FORM: wedge
SHAPE_62_N: 3
SHAPE_62_INNER: 0.0
SHAPE_62_ASPECT: 1.65
SHAPE_62_ROTATION_DEG: 0
SHAPE_62_CORE: 0.12
