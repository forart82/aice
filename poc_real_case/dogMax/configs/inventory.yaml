# LIFT PLAN step 7) — read via render::resolvePanelBackground. Re-add
# INVENTORY_PANEL_BG_R/G/B/A here to override the theme swatch for this
# panel only. The border reads the canonical UI_ACCENT (theme.yaml) — the
# old INVENTORY_PANEL_BORDER_* teal keys were dead (always overwritten) and
# have been removed.
INVENTORY_SCRIM_R: 0
INVENTORY_SCRIM_G: 0
INVENTORY_SCRIM_B: 0
INVENTORY_SCRIM_A: 0
