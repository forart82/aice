# Item-glyph typography + translucency (render::InventoryRenderer draw paths).
# ITEM_LABEL — weapon/dice name strip under each occupied cell; DICE_FACE — the
# rolled value drawn on a dice glyph. The two *_FILL_ALPHA values set the
# translucency of the dice-body glyph and the drag-ghost so the face colour
# reads through. Externalised from prior literals (10 / 15 / 60 / 100).
