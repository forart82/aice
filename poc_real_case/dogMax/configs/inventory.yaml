# T-INVRD-pdf-rewrite — additional design tokens for the PDF-conformant
# rewrite (examples/designOne/inventory_example.cpp). Every magic number
# the renderer reads lives here per CLAUDE.md Configuration rule.


# Powder stash list (render::InventoryRenderer::drawPowderColumn, via ui::UiList).
# TOTAL_* is the list's base text colour (every powder row tints from it);
# HEADER_* is the tint applied to the "POWDER <count>" summary row. Both were
# externalised from prior sf::Color literals ({210,216,230} / {150,165,180}) so
# no colour literal remains in the renderer's draw code.
INVENTORY_POWDER_HEADER_R: 150
INVENTORY_POWDER_HEADER_G: 165
INVENTORY_POWDER_HEADER_B: 180
# Powder list base text colour collapsed onto THEME_UI_TEXT (theme.yaml);
# the old INVENTORY_POWDER_TOTAL_R/G/B triple was removed (each powder row
# still tints this base by its own gameplay colour).

# T-INV-good-parity — vertical reserve above the powder column +
# slot grid for the inline title row + sort-tab strip + count badge
# row. Scales with adaptiveScale alongside every other layout dim.
# Numeric basis: title row ~22 px + tab row (sortButtonHeight=16) +
# 2 × sortButtonPadding gap + a 4 px terminal breath = 58 px at scale
# 1.0. Pad to 60 for round numbers; the grid + powder column slide
# down by this amount, and the panel height grows to compensate.
INVENTORY_TOP_BAND_HEIGHT: 60

# Weapons occupy this many vertically adjacent cells in one column.
# Dice always occupy 1 cell. Must be >= 1 and fit within INVENTORY_ROWS.

# Inventory panel (I) — component-based pixel-perfect renderer
# (render::InventoryRenderer). Full colour/typography token set; these
# values were the live VAULT_* palette before the Vault→Inventory rename
# (single inventory UI). Every magic number the renderer reads lives here
# per CLAUDE.md Configuration rule.
