# Dice-glyph box geometry (render::InventoryRenderer::drawDiceGlyph). The
# inventory die is now the canonical widgets::UiDiceCell (same widget as the
# weapon-slot sidebar: shader die, or fallback hex, + centred face value). The
# renderer hands the widget a square glyph box carved out of the 50 px cell so
# the die keeps its established inventory size and leaves a bottom band clear
# for the face-name ("D6") label. Box side = min(cellW,cellH) − 2·pad, where
# pad = max(PAD_MIN, cellW·PAD_FACTOR); the box is centred CENTER_Y_OFFSET px
# above the cell centre. Externalised from prior hard-coded literals (6 / 0.16
# / 4) per the Configuration rule.
INVENTORY_DICE_GLYPH_PAD_MIN: 6
INVENTORY_DICE_GLYPH_PAD_FACTOR: 0.16
INVENTORY_DICE_GLYPH_CENTER_Y_OFFSET: 4
