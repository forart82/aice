# Inventory panel: 8 rows x 7 columns = 56 cells. Dice occupy one cell;
# weapons occupy two vertically adjacent cells in one column.
INVENTORY_ROWS: 8
INVENTORY_COLUMNS: 7
# Slot=50 px matches the PDF reference grid — small enough for an 8-row
# stack to fit the 1920×1080 design viewport with the 224 px right
# sidebar and the 150 px powder rail, large enough that the SDF slot
# plates + glyphs remain legible. Footprint at 1920 design width:
# panel = 7*50 + 6*10 + 2*24 + 150 (powder col) = 608, leaving plenty
# of slack within the 1920 − 224 (sidebar) − 80 (2× margin) = 1616 band.
INVENTORY_SLOT_SIZE: 50
INVENTORY_SLOT_PADDING: 10
# Interior inset (px, scales with adaptiveScale) between the panel
# edge and its content — the powder column on the left and the slot
# grid. Applied symmetrically on all four sides via panelPaddingEff
# in InventoryLayout. 24 px gives the grid comfortable breathing room
# from the chamfered border and the top title/status chips.
INVENTORY_PANEL_PADDING: 24
INVENTORY_PANEL_TOP_OFFSET: 80
# Minimum horizontal gap (window px) the panel must keep on each
# side: between the window's left edge and the panel, and between
# the panel's right edge and the weapon-slot sidebar. Fixed in
# window pixels (does not scale with adaptiveScale), so the gap
# stays legible at every window size.
INVENTORY_PANEL_HORIZONTAL_MARGIN: 40
INVENTORY_DEPLOY_OPEN_SECONDS: 0.32
INVENTORY_DEPLOY_CLOSE_SECONDS: 0.22
# Panel substrate colour is the shared THEME_PANEL_BG_* (theme.yaml);
# render::InventoryRenderer reads it via resolvePanelBackground.
# Slot well: slightly lighter than pure black for depth.
INVENTORY_SLOT_BG_R: 8
INVENTORY_SLOT_BG_G: 8
INVENTORY_SLOT_BG_B: 8
# Neon cyan outline for empty slots — solid stroke, transparent fill-read.
INVENTORY_SLOT_OUTLINE_R: 0
INVENTORY_SLOT_OUTLINE_G: 200
INVENTORY_SLOT_OUTLINE_B: 230
INVENTORY_SLOT_OUTLINE_A: 60

# Panel border + sort-button accents are sourced from the canonical
# `UI_ACCENT_*` keys in theme.config (B-UX-11 single visual language).
# Do not redefine the accent triple here — every UI surface reads
# `render::UiAccent::loadFromConfig` so the chrome stays unified.

# Powder column geometry (Phase 5 / PDF design rewrite). Width 150 px
# matches the PDF left rail and gives the three destroy-tier buttons +
# the 11-row powder stash legible breathing room. Button height 34 px
# stacks Common/Uncommon/Rare without crowding.
INVENTORY_POWDER_COLUMN_WIDTH: 150

# SA27 / spec §Inventory L2254-L2256 — sort button strip dimensions.
# Three buttons sit above the slot grid, right-aligned to the grid.
# Index 0 = sort-by-tier, 1 = sort-by-type, 2 = toggle auto-sort.
# `STRIP_TOP_OFFSET` is the vertical gap between the bottom of the
# button strip and the top of the slot grid. Translucent dark fill
# matches the panel; the accent (above) drives the outline + active
# state for a coherent strip-as-trim read.
INVENTORY_SORT_BUTTON_BG_R: 0
INVENTORY_SORT_BUTTON_BG_G: 0
INVENTORY_SORT_BUTTON_BG_B: 0
