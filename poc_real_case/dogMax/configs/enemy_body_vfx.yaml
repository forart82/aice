# enemy_body_vfx.yaml — warm-white VFX accent colours (RGB 0..255) for the
# enemy body + death-explosion painters. Extracted from EnemyBodyPainter.cpp /
# EnemyDeathPainter.cpp so no colour literal lives in source (CLAUDE.md config
# rule). Read once in loadEnemyBodyParams() into EnemyBodyParams and passed to
# both painters.

# Death-explosion inner ring — the filled warm core-flash at the blast centre.
ENEMY_VFX_DEATH_INNER_RING_R: 255
ENEMY_VFX_DEATH_INNER_RING_G: 240
ENEMY_VFX_DEATH_INNER_RING_B: 220

# Death-explosion shard outline — thin rim on each industrial-debris quad.
ENEMY_VFX_DEATH_SHARD_OUTLINE_R: 255
ENEMY_VFX_DEATH_SHARD_OUTLINE_G: 240
ENEMY_VFX_DEATH_SHARD_OUTLINE_B: 200

# Death-explosion body-fragment outline — rim on each triangular body slab.
ENEMY_VFX_DEATH_FRAGMENT_OUTLINE_R: 255
ENEMY_VFX_DEATH_FRAGMENT_OUTLINE_G: 240
ENEMY_VFX_DEATH_FRAGMENT_OUTLINE_B: 220

# Level-band marker dot outline (was sf::Color::White in drawEnemyBody).
ENEMY_VFX_LEVEL_MARKER_R: 255
ENEMY_VFX_LEVEL_MARKER_G: 255
ENEMY_VFX_LEVEL_MARKER_B: 255

# ── World-space enemy-state VFX (extracted from WorldRenderer::render) ──
# Every value below was a hard-coded literal in the jump-shadow / berserk /
# jump-telegraph / landing-shockwave draw loops. Moved here verbatim (no value
# change); read once per frame in render() into locals used by those loops.

# Shared outline thickness for the four world-space state rings/ghosts
# (jump ghost, berserk ring, jump-telegraph marker, landing shockwave). This
# is DISTINCT from the body-silhouette outline (ENEMY_VFX_*_OUTLINE_THICKNESS
# below) even though numerically similar — do not fold them together.
ENEMY_VFX_WORLD_OUTLINE_THICKNESS: -3.0

# Jump dash-ghost afterimage outline tint (alpha is animated separately).
ENEMY_VFX_JUMP_GHOST_OUTLINE_R: 255
ENEMY_VFX_JUMP_GHOST_OUTLINE_G: 255
ENEMY_VFX_JUMP_GHOST_OUTLINE_B: 200

# Ground shadow cast under a mid-jump enemy: radius = enemyRadius * MULT.
ENEMY_VFX_JUMP_SHADOW_RADIUS_MULT: 0.65
ENEMY_VFX_JUMP_SHADOW_COLOR_R: 0
ENEMY_VFX_JUMP_SHADOW_COLOR_G: 0
ENEMY_VFX_JUMP_SHADOW_COLOR_B: 0
ENEMY_VFX_JUMP_SHADOW_COLOR_A: 80

# Berserk aura pulse ring. alpha = ALPHA_BASE + ALPHA_RANGE * pulse; the ring
# radius = enemyRadius + RING_OFFSET; pulse cycles at PULSE_SPEED rad/s.
ENEMY_VFX_BERSERK_PULSE_SPEED: 8.0
ENEMY_VFX_BERSERK_ALPHA_BASE: 140.0
ENEMY_VFX_BERSERK_ALPHA_RANGE: 80.0
ENEMY_VFX_BERSERK_RING_OFFSET: 4.0
ENEMY_VFX_BERSERK_RING_COLOR_R: 255
ENEMY_VFX_BERSERK_RING_COLOR_G: 40
ENEMY_VFX_BERSERK_RING_COLOR_B: 20

# Jump-telegraph target marker. alpha = ALPHA_BASE + ALPHA_RANGE * pulse; the
# fill alpha = FILL_ALPHA_MULT * pulse; ring radius = enemyRadius + RING_OFFSET.
ENEMY_VFX_JUMP_TELEGRAPH_PULSE_SPEED: 14.0
ENEMY_VFX_JUMP_TELEGRAPH_ALPHA_BASE: 100.0
ENEMY_VFX_JUMP_TELEGRAPH_ALPHA_RANGE: 130.0
ENEMY_VFX_JUMP_TELEGRAPH_RING_OFFSET: 10.0
ENEMY_VFX_JUMP_TELEGRAPH_FILL_ALPHA_MULT: 30.0

# Yellow tint shared by the jump-telegraph marker (fill + outline) and the
# landing shockwave outline — one jump-attack colour, one key.
ENEMY_VFX_JUMP_MARKER_COLOR_R: 255
ENEMY_VFX_JUMP_MARKER_COLOR_G: 220
ENEMY_VFX_JUMP_MARKER_COLOR_B: 0

# Landing shockwave: ring grows to enemyRadius + frac*enemyRadius*GROWTH_MULT;
# alpha = FADE_ALPHA * (1 - frac).
ENEMY_VFX_SHOCKWAVE_GROWTH_MULT: 2.5
ENEMY_VFX_SHOCKWAVE_FADE_ALPHA: 220.0

# ── Body / death painter outline thicknesses + shard aspect ────────────
# Extracted from EnemyBodyPainter.cpp / EnemyDeathPainter.cpp. Named per call
# site (the task's single ENEMY_VFX_BODY_OUTLINE_THICKNESS mapped to no single
# literal — the body silhouette outline is already config-driven via
# -haloThickness * outlineMult, so the two real literals are the marker-dot and
# the attack-flash ring).
ENEMY_VFX_LEVEL_MARKER_OUTLINE_THICKNESS: 1.0
ENEMY_VFX_ATTACK_FLASH_OUTLINE_THICKNESS: 3.0
ENEMY_VFX_ATTACK_FLASH_R: 255
ENEMY_VFX_ATTACK_FLASH_G: 235
ENEMY_VFX_ATTACK_FLASH_B: 190
ENEMY_VFX_ATTACK_FLASH_INNER_RADIUS_SCALE: 0.62
ENEMY_VFX_ATTACK_FLASH_FILL_ALPHA: 85

# Armed pre-hit warning: a red ring marks every committed attacker while a
# tightening ring closes on the hero's exact range-checked target point.
ENEMY_ARMED_TELEGRAPH_R: 255
ENEMY_ARMED_TELEGRAPH_G: 45
ENEMY_ARMED_TELEGRAPH_B: 24
ENEMY_ARMED_TELEGRAPH_ALPHA_MIN: 110
ENEMY_ARMED_TELEGRAPH_ALPHA_MAX: 245
ENEMY_ARMED_TELEGRAPH_RING_START_RADIUS: 90.0
ENEMY_ARMED_TELEGRAPH_RING_END_RADIUS: 38.0
ENEMY_ARMED_TELEGRAPH_RING_THICKNESS: 5.0
ENEMY_ARMED_TELEGRAPH_ATTACKER_RADIUS: 58.0
ENEMY_ARMED_TELEGRAPH_PRIORITY_THRESHOLD: 8
ENEMY_ARMED_TELEGRAPH_COMMON_ALPHA_MULT: 0.48
ENEMY_ARMED_TELEGRAPH_ELITE_ALPHA_MULT: 1.0
ENEMY_ARMED_TELEGRAPH_RANGE_ALPHA_MULT: 0.32
ENEMY_ARMED_TELEGRAPH_RANGE_THICKNESS: 2.0
ENEMY_ARMED_TELEGRAPH_LINK_ALPHA_MULT: 0.42
ENEMY_ARMED_TELEGRAPH_LINK_WIDTH: 3.0

# Generic offensive dash warning. The lane is the exact dash travel distance;
# its width and terminal disc use the real contact radius stored at commitment.
ENEMY_DASH_TELEGRAPH_R: 255
ENEMY_DASH_TELEGRAPH_G: 125
ENEMY_DASH_TELEGRAPH_B: 25
ENEMY_DASH_TELEGRAPH_ALPHA_MIN: 105
ENEMY_DASH_TELEGRAPH_ALPHA_MAX: 235
ENEMY_DASH_TELEGRAPH_THICKNESS: 3.0
# Armed generic dashes are movement-only: show their path without the wide
# damaging-contact footprint used by unarmed dashes and charges.
ENEMY_DASH_TELEGRAPH_MOVEMENT_WIDTH: 12.0
ENEMY_DASH_TELEGRAPH_MOVEMENT_ENDPOINT_RADIUS: 14.0

# Actual HP-loss confirmation on the hero. Unlike weapon-specific attack VFX,
# this ring appears only when damage was applied.
HERO_INCOMING_HIT_RING_START_RADIUS: 30.0
HERO_INCOMING_HIT_RING_END_RADIUS: 72.0
HERO_INCOMING_HIT_RING_THICKNESS: 5.0

# Amber warning pulse at the hero for every completed enemy weapon attack,
# including evaded and dash-invulnerable attempts. Red-white remains reserved
# for attacks that actually remove HP.
HERO_INCOMING_ATTACK_RING_START_RADIUS: 82.0
HERO_INCOMING_ATTACK_RING_END_RADIUS: 44.0
HERO_INCOMING_ATTACK_RING_THICKNESS: 4.0
HERO_INCOMING_ATTACK_TICK_MAX: 8
HERO_INCOMING_ATTACK_TICK_LENGTH: 13.0
HERO_INCOMING_ATTACK_TICK_WIDTH: 4.0
HERO_INCOMING_ATTACK_DIRECTION_LENGTH: 22.0
HERO_INCOMING_ATTACK_DIRECTION_WIDTH: 7.0

HERO_AVOIDED_ATTACK_RING_START_RADIUS: 34.0
HERO_AVOIDED_ATTACK_RING_END_RADIUS: 66.0
HERO_AVOIDED_ATTACK_RING_THICKNESS: 5.0
HERO_AVOIDED_ATTACK_R: 70
HERO_AVOIDED_ATTACK_G: 235
HERO_AVOIDED_ATTACK_B: 255
# Death shard quad: height = size * ASPECT_RATIO. Outline thicknesses pair with
# the SHARD/FRAGMENT colour keys above.
ENEMY_VFX_DEATH_SHARD_ASPECT_RATIO: 0.4
ENEMY_VFX_DEATH_SHARD_OUTLINE_THICKNESS: 0.5
ENEMY_VFX_DEATH_FRAGMENT_OUTLINE_THICKNESS: 0.8

# ── Spawn-portal literals (extracted from EnemySpawnPainter.cpp) ────────
# The rest of the ENEMY_SPAWN_PORTAL_* family lives in enemy.yaml; these are
# the four values that were still hard-coded in the portal draw code.
# Dark cyberpunk void colour of the event-horizon disc centre.
ENEMY_SPAWN_PORTAL_VOID_COLOR_R: 12
ENEMY_SPAWN_PORTAL_VOID_COLOR_G: 6
ENEMY_SPAWN_PORTAL_VOID_COLOR_B: 18
# Outer neon bloom: glow thickness = rimThickness * GLOW_THICKNESS_MULT;
# glow radius = radius + glowThickness * GLOW_RADIUS_MULT;
# glow alpha = rimAlpha * GLOW_ALPHA_MULT * openness.
ENEMY_SPAWN_PORTAL_GLOW_THICKNESS_MULT: 1.8
ENEMY_SPAWN_PORTAL_GLOW_RADIUS_MULT: 0.2
ENEMY_SPAWN_PORTAL_GLOW_ALPHA_MULT: 0.3
